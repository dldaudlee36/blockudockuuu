<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Blockudoku Clone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0369a1',
            }
          }
        }
      }
    };
  </script>
  <style>
    * {
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: #f8fafc;
      color: #0f172a;
      transition: background-color 0.25s ease, color 0.25s ease;
      overflow-x: hidden;
    }

    html.dark body {
      background-color: #0b0f19;
      color: #f8fafc;
    }

    .board-grid {
      display: grid;
      grid-template-columns: repeat(9, minmax(0, 1fr));
      grid-template-rows: repeat(9, minmax(0, 1fr));
      gap: 3px;
      padding: 6px;
      border-radius: 12px;
      background-color: #cbd5e1;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.08);
      position: relative;
    }

    html.dark .board-grid {
      background-color: #1e293b;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    .cell {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 4px;
      background-color: #f1f5f9;
      transition: background-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }

    html.dark .cell {
      background-color: #0f172a;
    }

    .cell.sector-alt {
      background-color: #e2e8f0;
    }

    html.dark .cell.sector-alt {
      background-color: #141e33;
    }

    .cell.border-r-thick {
      margin-right: 3px;
    }

    .cell.border-b-thick {
      margin-bottom: 3px;
    }

    .cell.occupied {
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.6), 0 2px 4px rgba(2, 132, 199, 0.35);
      border: 1px solid #0369a1;
    }

    html.dark .cell.occupied {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.25), 0 2px 4px rgba(0, 0, 0, 0.4);
      border: 1px solid #075985;
    }

    .cell.preview-valid {
      background-color: rgba(56, 189, 248, 0.45) !important;
      outline: 2px dashed #0284c7;
      outline-offset: -2px;
      transform: scale(0.96);
    }

    .cell.preview-clear {
      background-color: rgba(251, 191, 36, 0.6) !important;
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.7);
      animation: pulse-anticipation 0.6s infinite alternate;
    }

    @keyframes pulse-anticipation {
      from { transform: scale(0.94); opacity: 0.75; }
      to { transform: scale(1.02); opacity: 1; }
    }

    .cell.clearing {
      animation: cell-burst 0.32s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      z-index: 10;
    }

    @keyframes cell-burst {
      0% { transform: scale(1); filter: brightness(1.2); }
      50% { transform: scale(1.18); filter: brightness(1.8) drop-shadow(0 0 6px #38bdf8); }
      100% { transform: scale(0.2); opacity: 0; }
    }

    .cell.wave-tile {
      animation: wave-ripple 0.55s ease forwards;
    }

    @keyframes wave-ripple {
      0% { transform: scale(1); background-color: inherit; }
      40% { transform: translateY(-4px) scale(1.08); background-color: #38bdf8; box-shadow: 0 4px 10px rgba(56, 189, 248, 0.5); }
      100% { transform: translateY(0) scale(1); }
    }

    .tray-slot {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background-color: #e2e8f0;
      position: relative;
      touch-action: none;
      cursor: grab;
      transition: background-color 0.2s, transform 0.15s;
    }

    html.dark .tray-slot {
      background-color: #1e293b;
    }

    .tray-slot:active {
      cursor: grabbing;
    }

    .tray-slot.disabled {
      opacity: 0.25;
      cursor: not-allowed;
      filter: grayscale(1);
    }

    .floating-piece {
      position: fixed;
      pointer-events: none;
      z-index: 1000;
      transform: translate(-50%, -50%);
      transition: none;
      will-change: transform, left, top;
    }

    .caution-toast {
      animation: slideDownToast 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideDownToast {
      from { transform: translate(-50%, -20px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }

    .all-clear-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.94);
      border: 2px solid #f59e0b;
      padding: 16px 28px;
      border-radius: 18px;
      text-align: center;
      z-index: 60;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.6);
      animation: popBanner 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popBanner {
      0% { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    .floating-score {
      position: absolute;
      font-weight: 900;
      pointer-events: none;
      animation: floatUpFade 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      z-index: 50;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    @keyframes floatUpFade {
      0% { transform: translate(-50%, 0) scale(0.8); opacity: 0; }
      20% { transform: translate(-50%, -10px) scale(1.15); opacity: 1; }
      100% { transform: translate(-50%, -45px) scale(1); opacity: 0; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between max-w-md mx-auto p-4 sm:p-5 relative select-none">

  <!-- 헤더 영역 -->
  <header class="w-full flex items-center justify-between mb-2">
    <div>
      <h1 class="text-xl sm:text-2xl font-black tracking-tight text-sky-600 dark:text-sky-400">
        BLOCKUDOKU
      </h1>
      <p class="text-xs font-semibold text-slate-500 dark:text-slate-400">9×9 Block Sudoku</p>
    </div>

    <div class="flex items-center gap-2">
      <!-- 사운드 토글 -->
      <button id="sound-btn" class="w-10 h-10 rounded-full flex items-center justify-center bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 shadow-sm active:scale-95 transition" aria-label="사운드 설정">
        <i class="fa-solid fa-volume-high text-sm"></i>
      </button>

      <!-- 테마 토글 (라이트 기본) -->
      <button id="theme-btn" class="w-10 h-10 rounded-full flex items-center justify-center bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 shadow-sm active:scale-95 transition" aria-label="테마 전환">
        <i class="fa-solid fa-sun text-sm text-amber-500"></i>
      </button>

      <!-- 새 게임 모달 버튼 -->
      <button id="reset-btn" class="w-10 h-10 rounded-full flex items-center justify-center bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 shadow-sm active:scale-95 transition" aria-label="게임 초기화">
        <i class="fa-solid fa-rotate-right text-sm"></i>
      </button>
    </div>
  </header>

  <!-- 점수판 -->
  <section class="grid grid-cols-2 gap-3 w-full mb-3">
    <div class="bg-white dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/60 p-2.5 rounded-xl flex flex-col items-center shadow-sm">
      <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Score</span>
      <span id="current-score" class="text-2xl font-black text-slate-800 dark:text-white tabular-nums">0</span>
    </div>
    <div class="bg-white dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/60 p-2.5 rounded-xl flex flex-col items-center shadow-sm">
      <span class="text-[11px] font-bold text-amber-500 uppercase tracking-wider flex items-center gap-1">
        <i class="fa-solid fa-crown text-[10px]"></i> Best
      </span>
      <span id="best-score" class="text-2xl font-black text-slate-800 dark:text-white tabular-nums">0</span>
    </div>
  </section>

  <!-- 메인 보드 컨테이너 -->
  <main class="w-full relative flex-1 flex flex-col items-center justify-center">
    <div id="board" class="board-grid w-full max-w-[370px]">
      <!-- 81개 셀 동적 렌더링 -->
    </div>

    <!-- 피드백 & 텍스트 알림 레이어 -->
    <div id="feedback-layer" class="absolute inset-0 pointer-events-none overflow-hidden"></div>

    <!-- 신중하게 움직이세요 경고 배너 -->
    <div id="caution-banner" class="hidden absolute top-3 left-1/2 -translate-x-1/2 caution-toast z-40 bg-amber-500/95 text-slate-900 px-4 py-1.5 rounded-full font-black text-xs sm:text-sm shadow-lg flex items-center gap-2 border border-amber-300">
      <i class="fa-solid fa-triangle-exclamation animate-bounce"></i>
      <span>신중하게 움직이세요!</span>
    </div>
  </main>

  <!-- 블록 트레이 -->
  <footer class="w-full mt-3 mb-2">
    <div class="grid grid-cols-3 gap-3 w-full max-w-[370px] mx-auto">
      <div id="slot-0" class="tray-slot" data-index="0"></div>
      <div id="slot-1" class="tray-slot" data-index="1"></div>
      <div id="slot-2" class="tray-slot" data-index="2"></div>
    </div>
  </footer>

  <!-- 게임 오버 모달 -->
  <div id="game-over-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 w-full max-w-xs rounded-2xl p-6 text-center shadow-2xl">
      <div class="w-14 h-14 rounded-full bg-rose-100 dark:bg-rose-900/40 text-rose-500 mx-auto flex items-center justify-center text-2xl mb-3">
        <i class="fa-solid fa-gamepad"></i>
      </div>
      <h2 class="text-xl font-black text-slate-800 dark:text-white mb-1">게임 오버</h2>
      <p class="text-xs text-slate-500 dark:text-slate-400 mb-4">더 이상 배치할 수 있는 자리가 없습니다.</p>

      <div class="bg-slate-50 dark:bg-slate-800/60 rounded-xl p-3 mb-4">
        <div class="text-xs text-slate-400 mb-0.5">최종 점수</div>
        <div id="modal-final-score" class="text-3xl font-black text-sky-600 dark:text-sky-400 tabular-nums">0</div>
      </div>

      <div class="flex flex-col gap-2">
        <button id="revive-btn" class="w-full py-2.5 px-4 bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-950 font-black rounded-xl text-sm shadow hover:brightness-105 active:scale-95 transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-arrow-rotate-left"></i>
          <span>한 수 물리고 이어하기</span>
          <span id="revive-cost-badge" class="bg-slate-950/20 text-[11px] px-1.5 py-0.5 rounded-md">-50 P</span>
        </button>
        <button id="restart-btn" class="w-full py-2.5 px-4 bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold rounded-xl text-sm hover:bg-slate-300 dark:hover:bg-slate-700 active:scale-95 transition">
          처음부터 다시 시작
        </button>
      </div>
    </div>
  </div>

  <script>
    // Web Audio 신디사이저
    class SoundController {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContextClass();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, type = 'sine', duration = 0.12, gainVal = 0.15) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
          console.error(e);
        }
      }

      playPlace() {
        this.playTone(280, 'sine', 0.08, 0.12);
      }

      playClear(lines = 1) {
        const baseNotes = [392, 523.25, 659.25, 783.99, 1046.5];
        lines = Math.min(lines, baseNotes.length);
        for (let i = 0; i < lines; i++) {
          setTimeout(() => {
            this.playTone(baseNotes[i], 'triangle', 0.18, 0.2);
          }, i * 45);
        }
      }

      playAllClear() {
        const arpeggio = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
        arpeggio.forEach((note, idx) => {
          setTimeout(() => {
            this.playTone(note, 'sine', 0.25, 0.22);
          }, idx * 60);
        });
      }

      playGameOver() {
        [240, 210, 180, 140].forEach((freq, idx) => {
          setTimeout(() => {
            this.playTone(freq, 'sawtooth', 0.22, 0.15);
          }, idx * 110);
        });
      }
    }

    // 블록 템플릿
    const BLOCK_SHAPES = [
      { id: '1x1', matrix: [[1]] },
      { id: '2x1', matrix: [[1, 1]] },
      { id: '1x2', matrix: [[1], [1]] },
      { id: '3x1', matrix: [[1, 1, 1]] },
      { id: '1x3', matrix: [[1], [1], [1]] },
      { id: '4x1', matrix: [[1, 1, 1, 1]] },
      { id: '1x4', matrix: [[1], [1], [1], [1]] },
      { id: '5x1', matrix: [[1, 1, 1, 1, 1]] },
      { id: '1x5', matrix: [[1], [1], [1], [1], [1]] },
      { id: '2x2', matrix: [[1, 1], [1, 1]] },
      { id: '3x3', matrix: [[1, 1, 1], [1, 1, 1], [1, 1, 1]] },
      { id: 'L-tl', matrix: [[1, 0], [1, 1]] },
      { id: 'L-tr', matrix: [[0, 1], [1, 1]] },
      { id: 'L-bl', matrix: [[1, 1], [1, 0]] },
      { id: 'L-br', matrix: [[1, 1], [0, 1]] },
      { id: 'L-big-1', matrix: [[1, 0, 0], [1, 0, 0], [1, 1, 1]] },
      { id: 'L-big-2', matrix: [[0, 0, 1], [0, 0, 1], [1, 1, 1]] },
      { id: 'L-big-3', matrix: [[1, 1, 1], [1, 0, 0], [1, 0, 0]] },
      { id: 'L-big-4', matrix: [[1, 1, 1], [0, 0, 1], [0, 0, 1]] },
      { id: 'T-up', matrix: [[0, 1, 0], [1, 1, 1]] },
      { id: 'T-down', matrix: [[1, 1, 1], [0, 1, 0]] },
      { id: 'Z-h', matrix: [[1, 1, 0], [0, 1, 1]] },
      { id: 'S-h', matrix: [[0, 1, 1], [1, 1, 0]] },
      { id: 'diag-2', matrix: [[1, 0], [0, 1]] }
    ];

    class BlockudokuGame {
      constructor() {
        this.board = Array(9).fill(null).map(() => Array(9).fill(0));
        this.score = 0;
        this.bestScore = parseInt(localStorage.getItem('blockudoku_best_score') || '0', 10);
        this.streak = 0;
        this.tray = [null, null, null];
        this.previousState = null;
        this.reviveCost = 50;
        this.dangerWarned = false;

        this.sound = new SoundController();
        this.dragState = null;

        this.initTheme();
        this.cacheDOM();
        this.bindEvents();
        this.initBoardDOM();

        if (!this.loadGameSession()) {
          this.startNewGame();
        } else {
          this.renderBoard();
          this.renderTray();
          this.updateScoreView();
          this.checkAvailableMoves();
        }
      }

      initTheme() {
        // 기본 시작을 라이트 모드로 설정
        const savedTheme = localStorage.getItem('blockudoku_theme');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
          if (!savedTheme) {
            localStorage.setItem('blockudoku_theme', 'light');
          }
        }
      }

      cacheDOM() {
        this.domBoard = document.getElementById('board');
        this.domSlots = [
          document.getElementById('slot-0'),
          document.getElementById('slot-1'),
          document.getElementById('slot-2')
        ];
        this.domScore = document.getElementById('current-score');
        this.domBest = document.getElementById('best-score');
        this.domFeedback = document.getElementById('feedback-layer');
        this.domCaution = document.getElementById('caution-banner');
        this.domModal = document.getElementById('game-over-modal');
        this.domModalScore = document.getElementById('modal-final-score');
        this.domReviveBtn = document.getElementById('revive-btn');
        this.domRestartBtn = document.getElementById('restart-btn');
        this.domThemeBtn = document.getElementById('theme-btn');
        this.domSoundBtn = document.getElementById('sound-btn');
        this.domResetBtn = document.getElementById('reset-btn');
      }

      bindEvents() {
        this.domThemeBtn.addEventListener('click', () => this.toggleTheme());
        this.domSoundBtn.addEventListener('click', () => this.toggleSound());
        this.domResetBtn.addEventListener('click', () => {
          if (confirm('현재 진행 상황을 초기화하고 새 게임을 시작하시겠습니까?')) {
            this.startNewGame();
          }
        });

        this.domRestartBtn.addEventListener('click', () => {
          this.domModal.classList.add('hidden');
          this.startNewGame();
        });

        this.domReviveBtn.addEventListener('click', () => this.reviveAndContinue());

        // 전역 드래그 이벤트
        window.addEventListener('pointermove', (e) => this.onPointerMove(e), { passive: false });
        window.addEventListener('pointerup', (e) => this.onPointerUp(e));
        window.addEventListener('pointercancel', (e) => this.onPointerUp(e));
      }

      toggleTheme() {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('blockudoku_theme', isDark ? 'dark' : 'light');
        const icon = this.domThemeBtn.querySelector('i');
        if (isDark) {
          icon.className = 'fa-solid fa-moon text-sm text-sky-400';
        } else {
          icon.className = 'fa-solid fa-sun text-sm text-amber-500';
        }
      }

      toggleSound() {
        this.sound.enabled = !this.sound.enabled;
        const icon = this.domSoundBtn.querySelector('i');
        icon.className = this.sound.enabled
          ? 'fa-solid fa-volume-high text-sm'
          : 'fa-solid fa-volume-xmark text-sm text-rose-400';
      }

      initBoardDOM() {
        this.domBoard.innerHTML = '';
        for (let y = 0; y < 9; y++) {
          for (let x = 0; x < 9; x++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.x = x;
            cell.dataset.y = y;

            const secX = Math.floor(x / 3);
            const secY = Math.floor(y / 3);
            if ((secX + secY) % 2 === 1) {
              cell.classList.add('sector-alt');
            }

            if (x === 2 || x === 5) cell.classList.add('border-r-thick');
            if (y === 2 || y === 5) cell.classList.add('border-b-thick');

            this.domBoard.appendChild(cell);
          }
        }
      }

      startNewGame() {
        this.board = Array(9).fill(null).map(() => Array(9).fill(0));
        this.score = 0;
        this.streak = 0;
        this.previousState = null;
        this.dangerWarned = false;
        this.hideCautionWarning();
        this.renderBoard();
        this.spawnTrayBlocks();
        this.updateScoreView();
        this.saveGameSession();
      }

      saveGameSession() {
        const sessionData = {
          board: this.board,
          score: this.score,
          streak: this.streak,
          tray: this.tray
        };
        localStorage.setItem('blockudoku_session', JSON.stringify(sessionData));
        localStorage.setItem('blockudoku_best_score', this.bestScore.toString());
      }

      loadGameSession() {
        const raw = localStorage.getItem('blockudoku_session');
        if (!raw) return false;
        try {
          const data = JSON.parse(raw);
          if (data && Array.isArray(data.board) && Array.isArray(data.tray)) {
            this.board = data.board;
            this.score = data.score || 0;
            this.streak = data.streak || 0;
            this.tray = data.tray;
            return true;
          }
        } catch (e) {
          console.error(e);
        }
        return false;
      }

      saveUndoSnapshot() {
        this.previousState = {
          board: this.board.map(row => [...row]),
          score: this.score,
          streak: this.streak,
          tray: JSON.parse(JSON.stringify(this.tray))
        };
      }

      renderBoard() {
        for (let y = 0; y < 9; y++) {
          for (let x = 0; x < 9; x++) {
            const cellEl = this.getCellEl(x, y);
            if (!cellEl) continue;
            cellEl.classList.remove('occupied', 'clearing', 'preview-valid', 'preview-clear', 'wave-tile');
            if (this.board[y][x] === 1) {
              cellEl.classList.add('occupied');
            }
          }
        }
      }

      getCellEl(x, y) {
        return this.domBoard.querySelector(`.cell[data-x="${x}"][data-y="${y}"]`);
      }

      spawnTrayBlocks() {
        for (let i = 0; i < 3; i++) {
          const randomIndex = Math.floor(Math.random() * BLOCK_SHAPES.length);
          const chosen = BLOCK_SHAPES[randomIndex];
          this.tray[i] = JSON.parse(JSON.stringify(chosen));
        }
        this.renderTray();
        this.checkAvailableMoves();
      }

      renderTray() {
        this.domSlots.forEach((slotEl, idx) => {
          this.renderTraySlot(idx);
        });
      }

      renderTraySlot(slotIndex) {
        const slotEl = this.domSlots[slotIndex];
        slotEl.innerHTML = '';
        const piece = this.tray[slotIndex];

        if (!piece) {
          slotEl.classList.add('disabled');
          return;
        }

        slotEl.classList.remove('disabled');

        const matrix = piece.matrix;
        const rows = matrix.length;
        const cols = matrix[0].length;

        const pieceEl = document.createElement('div');
        pieceEl.className = 'grid gap-1 pointer-events-none';
        pieceEl.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
        pieceEl.style.width = `${cols * 16}px`;
        pieceEl.style.height = `${rows * 16}px`;

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const square = document.createElement('div');
            if (matrix[r][c] === 1) {
              square.className = 'w-full h-full rounded-sm bg-sky-500 shadow-sm border border-sky-600';
            } else {
              square.className = 'w-full h-full opacity-0';
            }
            pieceEl.appendChild(square);
          }
        }

        slotEl.appendChild(pieceEl);

        slotEl.onpointerdown = (e) => this.onSlotPointerDown(e, slotIndex);
      }

      onSlotPointerDown(e, slotIndex) {
        const piece = this.tray[slotIndex];
        if (!piece) return;

        e.preventDefault();
        this.sound.init();

        const rect = this.domSlots[slotIndex].getBoundingClientRect();
        const matrix = piece.matrix;
        const rows = matrix.length;
        const cols = matrix[0].length;

        // 드래그 중인 부유 피스 생성
        const floatingEl = document.createElement('div');
        floatingEl.className = 'floating-piece grid gap-1';
        floatingEl.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;

        const cellSize = 34; // 보드 셀과 유사한 크기로 확장
        floatingEl.style.width = `${cols * cellSize}px`;
        floatingEl.style.height = `${rows * cellSize}px`;

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const square = document.createElement('div');
            if (matrix[r][c] === 1) {
              square.className = 'w-full h-full rounded-md bg-gradient-to-br from-sky-400 to-sky-600 border border-sky-300 shadow-lg';
            } else {
              square.className = 'w-full h-full opacity-0';
            }
            floatingEl.appendChild(square);
          }
        }

        document.body.appendChild(floatingEl);
        this.domSlots[slotIndex].style.opacity = '0.3';

        const isTouch = e.pointerType === 'touch';
        const touchOffsetY = isTouch ? -65 : -15;

        this.dragState = {
          slotIndex,
          piece,
          element: floatingEl,
          touchOffsetY,
          lastValidX: null,
          lastValidY: null
        };

        this.updateFloatingPosition(e.clientX, e.clientY);
        this.updatePreview(e.clientX, e.clientY);
      }

      onPointerMove(e) {
        if (!this.dragState) return;
        e.preventDefault();
        this.updateFloatingPosition(e.clientX, e.clientY);
        this.updatePreview(e.clientX, e.clientY);
      }

      updateFloatingPosition(clientX, clientY) {
        if (!this.dragState) return;
        const targetY = clientY + this.dragState.touchOffsetY;
        this.dragState.element.style.left = `${clientX}px`;
        this.dragState.element.style.top = `${targetY}px`;
      }

      updatePreview(clientX, clientY) {
        this.clearPreviews();
        if (!this.dragState) return;

        const boardCoord = this.screenToBoardCoord(clientX, clientY + this.dragState.touchOffsetY);
        if (!boardCoord) {
          this.dragState.lastValidX = null;
          this.dragState.lastValidY = null;
          return;
        }

        const { x, y } = boardCoord;
        const matrix = this.dragState.piece.matrix;

        if (this.canPlaceBlock(matrix, x, y)) {
          this.dragState.lastValidX = x;
          this.dragState.lastValidY = y;
          this.drawPreview(matrix, x, y);
        } else {
          this.dragState.lastValidX = null;
          this.dragState.lastValidY = null;
        }
      }

      screenToBoardCoord(clientX, clientY) {
        const boardRect = this.domBoard.getBoundingClientRect();
        if (
          clientX < boardRect.left || clientX > boardRect.right ||
          clientY < boardRect.top || clientY > boardRect.bottom
        ) {
          return null;
        }

        const cellSize = boardRect.width / 9;
        const matrix = this.dragState.piece.matrix;
        const rows = matrix.length;
        const cols = matrix[0].length;

        // 피스의 중심 좌표를 기준으로 보드 셀 계산
        const relX = clientX - boardRect.left - (cols * cellSize) / 2;
        const relY = clientY - boardRect.top - (rows * cellSize) / 2;

        const gridX = Math.round(relX / cellSize);
        const gridY = Math.round(relY / cellSize);

        if (gridX >= 0 && gridX + cols <= 9 && gridY >= 0 && gridY + rows <= 9) {
          return { x: gridX, y: gridY };
        }
        return null;
      }

      clearPreviews() {
        const prevCells = this.domBoard.querySelectorAll('.preview-valid, .preview-clear');
        prevCells.forEach(cell => cell.classList.remove('preview-valid', 'preview-clear'));
      }

      drawPreview(matrix, originX, originY) {
        const simulatedBoard = this.board.map(r => [...r]);
        for (let r = 0; r < matrix.length; r++) {
          for (let c = 0; c < matrix[0].length; c++) {
            if (matrix[r][c] === 1) {
              const cellEl = this.getCellEl(originX + c, originY + r);
              if (cellEl) cellEl.classList.add('preview-valid');
              simulatedBoard[originY + r][originX + c] = 1;
            }
          }
        }

        // 지워질 라인 예측 강조
        const clearLines = this.detectClearsOnBoard(simulatedBoard);
        if (clearLines.length > 0) {
          const cellsToFlash = new Set();
          clearLines.forEach(line => {
            line.cells.forEach(coord => {
              cellsToFlash.add(`${coord.x},${coord.y}`);
            });
          });
          cellsToFlash.forEach(key => {
            const [cx, cy] = key.split(',').map(Number);
            const cEl = this.getCellEl(cx, cy);
            if (cEl) {
              cEl.classList.remove('preview-valid');
              cEl.classList.add('preview-clear');
            }
          });
        }
      }

      onPointerUp(e) {
        if (!this.dragState) return;

        const { slotIndex, element, lastValidX, lastValidY } = this.dragState;

        element.remove();
        this.domSlots[slotIndex].style.opacity = '1';
        this.clearPreviews();

        if (lastValidX !== null && lastValidY !== null) {
          this.placeBlock(slotIndex, lastValidX, lastValidY);
        }

        this.dragState = null;
      }

      canPlaceBlock(matrix, originX, originY) {
        const rows = matrix.length;
        const cols = matrix[0].length;

        if (originX < 0 || originX + cols > 9 || originY < 0 || originY + rows > 9) {
          return false;
        }

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (matrix[r][c] === 1) {
              if (this.board[originY + r][originX + c] === 1) {
                return false;
              }
            }
          }
        }
        return true;
      }

      placeBlock(slotIndex, originX, originY) {
        this.saveUndoSnapshot();

        const piece = this.tray[slotIndex];
        const matrix = piece.matrix;
        let placedTileCount = 0;

        for (let r = 0; r < matrix.length; r++) {
          for (let c = 0; c < matrix[0].length; c++) {
            if (matrix[r][c] === 1) {
              this.board[originY + r][originX + c] = 1;
              placedTileCount++;
            }
          }
        }

        this.sound.playPlace();
        this.renderBoard();

        // 1. 블록 자체 배치 점수 (칸당 1점 유지)
        this.addScore(placedTileCount);

        // 사용한 트레이 슬롯 비우기
        this.tray[slotIndex] = null;
        this.renderTraySlot(slotIndex);

        // 클리어 판정 및 점수 계산 (하향 밸런스 적용)
        this.processClears();

        // 트레이가 전부 비었으면 새로 3개 지급
        if (this.tray.every(item => item === null)) {
          this.spawnTrayBlocks();
        }

        this.checkAvailableMoves();
        this.saveGameSession();
      }

      detectClearsOnBoard(targetBoard) {
        const clears = [];

        // 1. 행 검사
        for (let y = 0; y < 9; y++) {
          if (targetBoard[y].every(v => v === 1)) {
            const cells = [];
            for (let x = 0; x < 9; x++) cells.push({ x, y });
            clears.push({ type: 'row', index: y, cells });
          }
        }

        // 2. 열 검사
        for (let x = 0; x < 9; x++) {
          let full = true;
          for (let y = 0; y < 9; y++) {
            if (targetBoard[y][x] !== 1) {
              full = false;
              break;
            }
          }
          if (full) {
            const cells = [];
            for (let y = 0; y < 9; y++) cells.push({ x, y });
            clears.push({ type: 'col', index: x, cells });
          }
        }

        // 3. 3x3 박스 검사
        for (let by = 0; by < 3; by++) {
          for (let bx = 0; bx < 3; bx++) {
            let full = true;
            const cells = [];
            for (let y = by * 3; y < by * 3 + 3; y++) {
              for (let x = bx * 3; x < bx * 3 + 3; x++) {
                if (targetBoard[y][x] !== 1) {
                  full = false;
                  break;
                }
                cells.push({ x, y });
              }
              if (!full) break;
            }
            if (full) {
              clears.push({ type: 'box', index: by * 3 + bx, cells });
            }
          }
        }

        return clears;
      }

      processClears() {
        const clears = this.detectClearsOnBoard(this.board);
        if (clears.length === 0) {
          this.streak = 0;
          return;
        }

        this.streak += 1;
        const lineCount = clears.length;

        // 클리어 점수 계산 공식 (하향 조정)
        // 기본 점수: 라인당 10점
        const baseScore = lineCount * 10;

        // 콤보 승수 (1개: 1.0, 2개: 1.3, 3개: 1.7, 4개+: 2.0 + (N-4)*0.3)
        let comboMult = 1.0;
        if (lineCount === 2) comboMult = 1.3;
        else if (lineCount === 3) comboMult = 1.7;
        else if (lineCount >= 4) comboMult = 2.0 + (lineCount - 4) * 0.3;

        // 스트릭 승수 (1회: 1.0, 2연속: 1.2, 3연속: 1.4, 4연속+: 1.6 + (S-4)*0.1)
        let streakMult = 1.0;
        if (this.streak === 2) streakMult = 1.2;
        else if (this.streak === 3) streakMult = 1.4;
        else if (this.streak >= 4) streakMult = 1.6 + (this.streak - 4) * 0.1;

        const gainedScore = Math.round(baseScore * comboMult * streakMult);
        this.addScore(gainedScore);

        this.sound.playClear(lineCount);

        // 제거 타일 애니메이션
        const uniqueCells = new Set();
        clears.forEach(line => {
          line.cells.forEach(c => uniqueCells.add(`${c.x},${c.y}`));
        });

        uniqueCells.forEach(key => {
          const [cx, cy] = key.split(',').map(Number);
          const cellEl = this.getCellEl(cx, cy);
          if (cellEl) cellEl.classList.add('clearing');
          this.board[cy][cx] = 0;
        });

        // 텍스트 피드백 표시
        this.showFloatingFeedback(`+${gainedScore}`);

        setTimeout(() => {
          this.renderBoard();
          this.checkAllClear();
          this.checkAvailableMoves();
        }, 300);
      }

      checkAllClear() {
        const isBoardEmpty = this.board.every(row => row.every(val => val === 0));
        if (isBoardEmpty) {
          this.triggerAllClear();
        }
      }

      triggerAllClear() {
        this.addScore(100);
        this.sound.playAllClear();

        // ALL CLEAR 배너 출력
        const banner = document.createElement('div');
        banner.className = 'all-clear-banner';
        banner.innerHTML = `
          <div class="text-2xl sm:text-3xl font-black text-amber-400 tracking-wider mb-1 flex items-center justify-center gap-2">
            <i class="fa-solid fa-star text-lg animate-spin"></i>
            <span>ALL CLEAR!</span>
            <i class="fa-solid fa-star text-lg animate-spin"></i>
          </div>
          <div class="text-base sm:text-lg font-black text-sky-400 tracking-wide">+100 BONUS</div>
        `;
        this.domFeedback.appendChild(banner);
        setTimeout(() => banner.remove(), 2300);

        // 파도타기 애니메이션
        for (let y = 0; y < 9; y++) {
          for (let x = 0; x < 9; x++) {
            const cellEl = this.getCellEl(x, y);
            if (cellEl) {
              setTimeout(() => {
                cellEl.classList.add('wave-tile');
                setTimeout(() => cellEl.classList.remove('wave-tile'), 600);
              }, y * 55 + (x % 3) * 15);
            }
          }
        }
      }

      showFloatingFeedback(text, isDanger = false) {
        const floatEl = document.createElement('div');
        floatEl.className = 'floating-score text-xl';
        floatEl.style.color = isDanger ? '#f43f5e' : '#38bdf8';
        floatEl.style.left = '50%';
        floatEl.style.top = '45%';
        floatEl.innerText = text;
        this.domFeedback.appendChild(floatEl);
        setTimeout(() => floatEl.remove(), 900);
      }

      addScore(amount) {
        this.score += amount;
        if (this.score > this.bestScore) {
          this.bestScore = this.score;
        }
        this.updateScoreView();
      }

      updateScoreView() {
        this.domScore.innerText = this.score.toLocaleString();
        this.domBest.innerText = this.bestScore.toLocaleString();
      }

      checkAvailableMoves() {
        let occupiedCount = 0;
        for (let y = 0; y < 9; y++) {
          for (let x = 0; x < 9; x++) {
            if (this.board[y][x] === 1) occupiedCount++;
          }
        }

        const occupancyRatio = occupiedCount / 81;
        let validMoveCount = 0;

        this.tray.forEach((piece, index) => {
          if (!piece) return;
          const slotEl = this.domSlots[index];
          const canFit = this.canPieceFitAnywhere(piece.matrix);

          if (canFit) {
            validMoveCount++;
            slotEl.classList.remove('disabled');
          } else {
            slotEl.classList.add('disabled');
          }
        });

        // 위기 감지 및 "신중하게 움직이세요!" 배너
        const remainingPieces = this.tray.filter(p => p !== null).length;
        if ((occupancyRatio >= 0.70 || (remainingPieces >= 2 && validMoveCount === 1)) && validMoveCount > 0) {
          if (!this.dangerWarned) {
            this.showCautionWarning();
            this.dangerWarned = true;
          }
        } else if (occupancyRatio < 0.55) {
          this.dangerWarned = false;
        }

        // 게임 오버 판정
        if (remainingPieces > 0 && validMoveCount === 0) {
          setTimeout(() => this.triggerGameOver(), 400);
        }
      }

      canPieceFitAnywhere(matrix) {
        const rows = matrix.length;
        const cols = matrix[0].length;

        for (let y = 0; y <= 9 - rows; y++) {
          for (let x = 0; x <= 9 - cols; x++) {
            if (this.canPlaceBlock(matrix, x, y)) {
              return true;
            }
          }
        }
        return false;
      }

      showCautionWarning() {
        this.domCaution.classList.remove('hidden');
        setTimeout(() => this.hideCautionWarning(), 2600);
      }

      hideCautionWarning() {
        this.domCaution.classList.add('hidden');
      }

      triggerGameOver() {
        this.sound.playGameOver();
        this.domModalScore.innerText = this.score.toLocaleString();

        const penalty = Math.min(this.score, this.reviveCost);
        document.getElementById('revive-cost-badge').innerText = `-${penalty} P`;

        if (!this.previousState) {
          this.domReviveBtn.classList.add('hidden');
        } else {
          this.domReviveBtn.classList.remove('hidden');
        }

        this.domModal.classList.remove('hidden');
      }

      reviveAndContinue() {
        if (!this.previousState) return;

        // 직전 상태로 복원
        this.board = this.previousState.board.map(r => [...r]);
        this.streak = this.previousState.streak;
        this.tray = JSON.parse(JSON.stringify(this.previousState.tray));

        // 점수 패널티 차감 (최대 50점, 0점 미만 불가)
        const penalty = Math.min(this.score, this.reviveCost);
        this.score = Math.max(0, this.score - penalty);

        this.previousState = null; // 1회 사용 후 소진

        this.domModal.classList.add('hidden');
        this.renderBoard();
        this.renderTray();
        this.updateScoreView();
        this.showFloatingFeedback(`-${penalty} P (부활)`, true);

        this.checkAvailableMoves();
        this.saveGameSession();
      }
    }

    // 전역 실행 및 인스턴스 노출
    window.addEventListener('DOMContentLoaded', () => {
      window.gameInstance = new BlockudokuGame();
    });
  </script>
</body>
