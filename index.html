<!DOCTYPE html>
<html lang="ko" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Blockudoku</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8'
            }
          }
        }
      }
    }
  </script>
  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-page: #f2f5f9;
      --bg-card: #ffffff;
      --border-card: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --board-border: #cbd5e1;
      --board-outer: #d9e1ec;
      --cell-even-zone: #ffffff;
      --cell-odd-zone: #e9eff7;
      --cell-empty-border: #dbe4ef;
      --block-color-from: #3b82f6;
      --block-color-to: #2563eb;
      --block-border: #1d4ed8;
      --tray-bg: #e5ecf5;
      --slot-bg: #f8fafc;
      --modal-bg: rgba(255, 255, 255, 0.95);
      --modal-card: #ffffff;
    }

    html.dark {
      --bg-page: #0b1120;
      --bg-card: #131d31;
      --border-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --board-border: #334155;
      --board-outer: #1e293b;
      --cell-even-zone: #1e293b;
      --cell-odd-zone: #162032;
      --cell-empty-border: #283548;
      --block-color-from: #38bdf8;
      --block-color-to: #2563eb;
      --block-border: #1d4ed8;
      --tray-bg: #111a2d;
      --slot-bg: #152238;
      --modal-bg: rgba(11, 17, 32, 0.92);
      --modal-card: #131d31;
    }

    * {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      transition: background-color 0.25s ease, color 0.25s ease;
      overflow: hidden;
      touch-action: none;
    }

    .board-container-wrapper {
      position: relative;
      background: var(--board-outer);
      padding: 6px;
      border-radius: 18px;
      box-shadow: 0 12px 30px -8px rgba(0, 0, 0, 0.12), inset 0 2px 4px rgba(255, 255, 255, 0.15);
      border: 2px solid var(--board-border);
      transition: background 0.25s, border-color 0.25s;
    }

    .board-grid {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      grid-template-rows: repeat(9, 1fr);
      gap: 3px;
      width: 100%;
      height: 100%;
    }

    /* Authentic 3x3 Sudoku boundary lines via borders */
    .cell {
      position: relative;
      background-color: var(--cell-even-zone);
      border: 1px solid var(--cell-empty-border);
      border-radius: 4px;
      transition: background-color 0.12s ease, transform 0.12s ease, border-color 0.12s ease;
    }

    .cell.zone-alt {
      background-color: var(--cell-odd-zone);
    }

    /* 3x3 sector separator borders */
    .cell.border-right-thick {
      margin-right: 2px;
    }
    .cell.border-bottom-thick {
      margin-bottom: 2px;
    }

    /* Block Placed styling */
    .cell.occupied {
      background: linear-gradient(145deg, var(--block-color-from) 0%, var(--block-color-to) 100%) !important;
      border: 1px solid var(--block-border) !important;
      box-shadow: inset 0 1.5px 2px rgba(255, 255, 255, 0.45), 0 2px 4px rgba(0, 0, 0, 0.18);
      border-radius: 5px;
    }

    /* Ghost Preview when hovering block */
    .cell.ghost-valid {
      background: rgba(59, 130, 246, 0.28) !important;
      border: 1.5px dashed #3b82f6 !important;
      border-radius: 5px;
      transform: scale(0.97);
    }

    /* Anticipation Glow: lines that will be cleared */
    .cell.will-clear {
      animation: pulse-anticipate 0.35s infinite alternate ease-in-out;
      background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%) !important;
      border-color: #f59e0b !important;
      z-index: 5;
    }

    @keyframes pulse-anticipate {
      0% { transform: scale(0.95); opacity: 0.85; filter: brightness(1); }
      100% { transform: scale(1.05); opacity: 1; filter: brightness(1.3); }
    }

    /* Cell clearing explosion */
    .cell.clearing {
      animation: clear-burst 0.32s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
      z-index: 10;
    }

    @keyframes clear-burst {
      0% { transform: scale(1); filter: brightness(2.2); }
      40% { transform: scale(1.22); opacity: 0.95; }
      100% { transform: scale(0); opacity: 0; }
    }

    /* All Clear: Wave Cascade across empty tiles */
    .cell.wave-tile {
      animation: board-wave 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      z-index: 15;
    }

    @keyframes board-wave {
      0% {
        transform: scale(1) translateY(0);
        background-color: var(--cell-even-zone);
      }
      35% {
        transform: scale(1.12) translateY(-4px);
        background: linear-gradient(135deg, #38bdf8 0%, #3b82f6 100%) !important;
        border-color: #60a5fa !important;
        box-shadow: 0 6px 14px rgba(56, 189, 248, 0.45);
        filter: brightness(1.5);
      }
      100% {
        transform: scale(1) translateY(0);
        filter: brightness(1);
      }
    }

    /* All Clear Celebration Popup Banner */
    .all-clear-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      opacity: 0;
      pointer-events: none;
      z-index: 60;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 28px;
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.92);
      border: 2px solid #f59e0b;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 35px rgba(245, 158, 11, 0.45);
      color: #ffffff;
      animation: all-clear-pop 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    html.dark .all-clear-banner {
      background: rgba(11, 17, 32, 0.96);
    }

    @keyframes all-clear-pop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5);
      }
      15% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1);
      }
      25% {
        transform: translate(-50%, -50%) scale(1);
      }
      75% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -60%) scale(0.9);
      }
    }

    /* Caution Danger Alert Banner */
    .caution-toast {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translate(-50%, -8px) scale(0.95);
      opacity: 0;
      pointer-events: none;
      z-index: 55;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 16px;
      border-radius: 9999px;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.96) 0%, rgba(234, 88, 12, 0.96) 100%);
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: -0.01em;
      box-shadow: 0 8px 20px -4px rgba(234, 88, 12, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.25);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .caution-toast.show {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }

    .tray-container {
      background: var(--tray-bg);
      border: 1.5px solid var(--border-card);
      border-radius: 20px;
      transition: background 0.25s, border-color 0.25s;
    }

    .tray-slot {
      position: relative;
      width: 100%;
      height: 94px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      border-radius: 14px;
      background: var(--slot-bg);
      border: 1px dashed var(--border-card);
      transition: background 0.25s, border-color 0.25s;
    }

    .tray-block {
      display: grid;
      gap: 3px;
      cursor: grab;
      touch-action: none;
      transform-origin: center center;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s;
    }

    .tray-block.disabled {
      opacity: 0.22;
      cursor: not-allowed;
      filter: grayscale(100%);
    }

    .tray-block:active {
      cursor: grabbing;
    }

    .mini-cell {
      background: linear-gradient(145deg, var(--block-color-from) 0%, var(--block-color-to) 100%);
      border: 1px solid var(--block-border);
      border-radius: 3.5px;
      box-shadow: inset 0 1px 1.5px rgba(255, 255, 255, 0.4);
    }

    #drag-clone {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      display: none;
      transform-origin: center center;
      filter: drop-shadow(0 14px 22px rgba(0, 0, 0, 0.35));
    }

    /* Floating Score Notification */
    .score-popup {
      position: absolute;
      pointer-events: none;
      font-weight: 900;
      color: #2563eb;
      text-shadow: 0 2px 8px rgba(255, 255, 255, 0.85);
      animation: score-float 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      z-index: 50;
    }

    html.dark .score-popup {
      color: #38bdf8;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    @keyframes score-float {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
      20% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); }
      100% { opacity: 0; transform: translate(-50%, -100%) scale(0.95); }
    }

    .screen-shake {
      animation: shake 0.24s cubic-bezier(.36, .07, .19, .97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-1.5px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-3px, 0, 0); }
      40%, 60% { transform: translate3d(3px, 0, 0); }
    }
  </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen max-w-md mx-auto p-4 select-none">

    <div class="w-full flex items-center justify-between">
      <!-- Logo & App Title -->
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center text-white font-black text-base shadow-md">
          B
        </div>
        <span class="font-black text-lg tracking-tight">Blockudoku</span>

      <!-- Action buttons: Theme, Sound, Undo, Restart -->
      <div class="flex items-center gap-2">
        <button id="undo-btn" title="한 수 무르기" class="w-8 h-8 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-700 dark:text-slate-200 shadow-sm transition active:scale-95 disabled:opacity-30 disabled:pointer-events-none" aria-label="Undo Move" disabled>

      <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-rose-500/10 dark:bg-rose-500/20 border border-rose-500/30 flex items-center justify-center text-rose-500 text-2xl shadow-inner">

          <span class="text-xs font-semibold text-slate-500 dark:text-slate-400">최고 기록</span>

          <i class="fa-solid fa-heart-pulse"></i>
          <span>한 수 물리고 이어하기</span>

          <i class="fa-solid fa-rotate-right"></i> 처음부터 다시 시작

  <!-- Reset Confirmation Toast -->
  <div id="reset-confirm-modal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden transition-opacity duration-200 opacity-0">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 w-full max-w-xs text-center shadow-xl">
      <h3 class="text-lg font-black mb-2">새 게임 시작</h3>
      <p class="text-xs text-slate-500 dark:text-slate-400 mb-5">현재 진행 중인 판을 초기화하시겠습니까?</p>
      <div class="grid grid-cols-2 gap-2">
        <button id="cancel-reset-btn" class="py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
          취소
        </button>
        <button id="confirm-reset-btn" class="py-2.5 rounded-xl bg-blue-600 text-xs font-bold text-white shadow-md hover:bg-blue-500 transition">
          초기화
        </button>
      </div>
    </div>
  </div>

  <script>
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
        this.pitches = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25, 587.33];
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, type = 'sine', duration = 0.1, gainValue = 0.15) {
        if (!this.enabled || !this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

          gain.gain.setValueAtTime(gainValue, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
          console.warn('Audio error:', e);
        }
      }

      playPlace() {
        this.playTone(320, 'triangle', 0.08, 0.2);
      }

      playGrab() {
        this.playTone(480, 'sine', 0.04, 0.08);
      }

      playClear(streakCount = 0, unitsCount = 1) {
        if (!this.enabled || !this.ctx) return;
        const baseIdx = Math.min(streakCount, this.pitches.length - 1);
        const pitch = this.pitches[baseIdx];

        this.playTone(pitch, 'triangle', 0.25, 0.22);
        setTimeout(() => this.playTone(pitch * 1.25, 'sine', 0.22, 0.16), 40);
        if (unitsCount > 1) {
          setTimeout(() => this.playTone(pitch * 1.5, 'sine', 0.32, 0.2), 80);
        }
      }

      playGameOver() {
        if (!this.enabled || !this.ctx) return;
        this.playTone(280, 'sawtooth', 0.2, 0.18);
        setTimeout(() => this.playTone(220, 'sawtooth', 0.25, 0.18), 140);
        setTimeout(() => this.playTone(160, 'sawtooth', 0.35, 0.2), 280);
      }

      playAllClear() {
        if (!this.enabled || !this.ctx) return;
        const arpeggio = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
        arpeggio.forEach((pitch, idx) => {
          setTimeout(() => {
            this.playTone(pitch, 'sine', 0.28, 0.18);
          }, idx * 70);
        });
      }
    }

    const sound = new SoundEngine();

    class ThemeManager {
      constructor() {
        this.htmlEl = document.documentElement;
        this.toggleBtn = document.getElementById('theme-toggle-btn');
        this.themeIcon = document.getElementById('theme-icon');

        const saved = localStorage.getItem('blockudoku_theme');
        if (saved) {
          this.setTheme(saved);
        } else {
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          this.setTheme(prefersDark ? 'dark' : 'light');
        }

        this.toggleBtn.addEventListener('click', () => {
          const current = this.htmlEl.classList.contains('dark') ? 'dark' : 'light';
          this.setTheme(current === 'dark' ? 'light' : 'dark');
        });
      }

      setTheme(theme) {
        if (theme === 'dark') {
          this.htmlEl.classList.add('dark');
          this.themeIcon.className = 'fa-solid fa-sun text-xs text-amber-400';
        } else {
          this.htmlEl.classList.remove('dark');
          this.themeIcon.className = 'fa-solid fa-moon text-xs text-slate-700';
        }
        localStorage.setItem('blockudoku_theme', theme);
      }
    }

    const BLOCK_SHAPES = [
      // Tier 1 (Small & Rescue)
      { id: '1x1', tier: 1, matrix: [[1]] },
      { id: '1x2', tier: 1, matrix: [[1, 1]] },
      { id: '2x1', tier: 1, matrix: [[1], [1]] },
      { id: '1x3', tier: 1, matrix: [[1, 1, 1]] },
      { id: '3x1', tier: 1, matrix: [[1], [1], [1]] },
      { id: 'corner-2x2-1', tier: 1, matrix: [[1, 0], [1, 1]] },
      { id: 'corner-2x2-2', tier: 1, matrix: [[0, 1], [1, 1]] },
      { id: 'corner-2x2-3', tier: 1, matrix: [[1, 1], [1, 0]] },
      { id: 'corner-2x2-4', tier: 1, matrix: [[1, 1], [0, 1]] },

      // Tier 2 (Standard Tetrominoes)
      { id: '2x2', tier: 2, matrix: [[1, 1], [1, 1]] },
      { id: '1x4', tier: 2, matrix: [[1, 1, 1, 1]] },
      { id: '4x1', tier: 2, matrix: [[1], [1], [1], [1]] },
      { id: 'L-4-1', tier: 2, matrix: [[1, 0], [1, 0], [1, 1]] },
      { id: 'L-4-2', tier: 2, matrix: [[0, 1], [0, 1], [1, 1]] },
      { id: 'L-4-3', tier: 2, matrix: [[1, 1, 1], [1, 0, 0]] },
      { id: 'L-4-4', tier: 2, matrix: [[1, 1, 1], [0, 0, 1]] },
      { id: 'T-4-1', tier: 2, matrix: [[1, 1, 1], [0, 1, 0]] },
      { id: 'T-4-2', tier: 2, matrix: [[0, 1, 0], [1, 1, 1]] },
      { id: 'T-4-3', tier: 2, matrix: [[1, 0], [1, 1], [1, 0]] },
      { id: 'T-4-4', tier: 2, matrix: [[0, 1], [1, 1], [0, 1]] },
      { id: 'Z-4-1', tier: 2, matrix: [[1, 1, 0], [0, 1, 1]] },
      { id: 'S-4-1', tier: 2, matrix: [[0, 1, 1], [1, 1, 0]] },

      // Tier 3 (Hazard & Large)
      { id: '1x5', tier: 3, matrix: [[1, 1, 1, 1, 1]] },
      { id: '5x1', tier: 3, matrix: [[1], [1], [1], [1], [1]] },
      { id: 'corner-3x3-1', tier: 3, matrix: [[1, 0, 0], [1, 0, 0], [1, 1, 1]] },
      { id: 'corner-3x3-2', tier: 3, matrix: [[0, 0, 1], [0, 0, 1], [1, 1, 1]] },
      { id: 'corner-3x3-3', tier: 3, matrix: [[1, 1, 1], [1, 0, 0], [1, 0, 0]] },
      { id: 'corner-3x3-4', tier: 3, matrix: [[1, 1, 1], [0, 0, 1], [0, 0, 1]] },
      { id: 'plus-5', tier: 3, matrix: [[0, 1, 0], [1, 1, 1], [0, 1, 0]] },
      { id: '3x3-giant', tier: 3, matrix: [[1, 1, 1], [1, 1, 1], [1, 1, 1]] }
    ];

    class BlockudokuGame {
      constructor() {
        this.board = Array(9).fill(null).map(() => Array(9).fill(0));
        this.tray = [null, null, null];
        this.score = 0;
        this.highScore = parseInt(localStorage.getItem('blockudoku_high_score') || '0', 10);
        this.streak = 0;
        this.isGameOver = false;
        this.dangerWarned = false;
        this.cautionTimer = null;

        // Revive Snapshot
        this.historySnapshot = null;
        this.reviveCost = 50;

        this.draggedSlotIndex = null;
        this.draggedShape = null;
        this.dragClone = document.getElementById('drag-clone');
        this.touchOffsetY = 70;
        this.currentHoverCoords = null;

        this.initDOM();
        this.bindEvents();

        // Restore saved session or start fresh
        if (!this.loadGameSession()) {
          this.startNewGame();
        }
      }

      initDOM() {
        const boardEl = document.getElementById('board');
        boardEl.innerHTML = '';

        for (let y = 0; y < 9; y++) {
          for (let x = 0; x < 9; x++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.x = x;
            cell.dataset.y = y;

            const zoneX = Math.floor(x / 3);
            const zoneY = Math.floor(y / 3);
            if ((zoneX + zoneY) % 2 === 1) {
              cell.classList.add('zone-alt');
            }

            if (x === 2 || x === 5) cell.classList.add('border-right-thick');
            if (y === 2 || y === 5) cell.classList.add('border-bottom-thick');

            boardEl.appendChild(cell);
          }
        }
        document.getElementById('high-score').textContent = this.highScore;
      }

      startNewGame() {
        this.board = Array(9).fill(null).map(() => Array(9).fill(0));
        this.score = 0;
        this.streak = 0;
        this.isGameOver = false;
        this.dangerWarned = false;
        this.historySnapshot = null;
        this.hideCautionWarning();
        this.updateScoreDisplay();
        this.updateStreakBadge();
        this.renderBoard();
        this.spawnTraySet();
        this.saveGameSession();

        const modal = document.getElementById('game-over-modal');
        modal.classList.add('hidden');
        modal.classList.remove('opacity-100');
      }

      // Save current board and state to localStorage
      saveGameSession() {
        if (this.isGameOver) {
          localStorage.removeItem('blockudoku_saved_session');
          return;
        }
        const state = {
          board: this.board,
          tray: this.tray,
          score: this.score,
          streak: this.streak,
          highScore: this.highScore,
          timestamp: Date.now()
        };
        try {
          localStorage.setItem('blockudoku_saved_session', JSON.stringify(state));
        } catch (e) {
          console.warn('Failed to save session:', e);
        }
      }

      // Restore session from localStorage if available
      loadGameSession() {
        try {
          const raw = localStorage.getItem('blockudoku_saved_session');
          if (!raw) return false;
          const data = JSON.parse(raw);
          if (!data || !data.board || !data.tray) return false;

          this.board = data.board;
          this.tray = data.tray;
          this.score = data.score || 0;
          this.streak = data.streak || 0;
          this.isGameOver = false;

          this.updateScoreDisplay();
          this.updateStreakBadge();
          this.renderBoard();
          this.renderTray();
          this.checkAvailableMoves();

          console.log('🔄 이전 플레이 세션이 복원되었습니다. (Score:', this.score, ')');
          return true;
        } catch (e) {
          console.warn('Failed to load session:', e);
          return false;
        }
      }

      // Create snapshot before move
      captureSnapshot() {
        this.historySnapshot = {
          board: this.board.map(row => [...row]),
          tray: JSON.parse(JSON.stringify(this.tray)),
          score: this.score,
          streak: this.streak
        };
      }

      // Revive and deduct penalty points
      reviveAndContinue() {
        if (!this.historySnapshot) return false;

        this.board = this.historySnapshot.board.map(row => [...row]);
        this.tray = JSON.parse(JSON.stringify(this.historySnapshot.tray));
        
        // Deduct penalty points (minimum 0)
        const penalty = Math.min(this.reviveCost, this.historySnapshot.score);
        this.score = Math.max(0, this.historySnapshot.score - penalty);
        this.streak = this.historySnapshot.streak;
        this.isGameOver = false;
        this.historySnapshot = null;

        const modal = document.getElementById('game-over-modal');
        modal.classList.add('hidden');
        modal.classList.remove('opacity-100');

        this.updateScoreDisplay();
        this.updateStreakBadge();
        this.renderBoard();
        this.renderTray();
        this.checkAvailableMoves();
        this.saveGameSession();

        // Show penalty score deduction notification
        const feedbackLayer = document.getElementById('feedback-layer');
        if (feedbackLayer) {
          const penaltyPopup = document.createElement('div');
          penaltyPopup.className = 'score-popup text-lg font-black text-rose-500';
          penaltyPopup.style.left = '50%';
          penaltyPopup.style.top = '40%';
          penaltyPopup.textContent = `-${penalty} P (부활 차감)`;
          feedbackLayer.appendChild(penaltyPopup);
          setTimeout(() => penaltyPopup.remove(), 950);
        }

        sound.playPlace();
        return true;
      }

      getOccupancyRatio() {
        let occupied = 0;
        for (let y = 0; y < 9; y++) {
          for (let x = 0; x < 9; x++) {
            if (this.board[y][x] === 1) occupied++;
          }
        }
        return occupied / 81;
      }

      spawnTraySet() {
        const ratio = this.getOccupancyRatio();
        const newTray = [];
        let hasHazard = false;

        for (let i = 0; i < 3; i++) {
          let pool = BLOCK_SHAPES.slice();

          if (ratio > 0.65) {
            pool = pool.filter(b => b.tier <= 2);
          }

          if (hasHazard) {
            pool = pool.filter(b => b.tier < 3);
          }

          const picked = pool[Math.floor(Math.random() * pool.length)];
          if (picked.tier === 3) hasHazard = true;

          newTray.push(picked);
        }

        const canPlace = newTray.some(block => this.canPlaceSomewhere(block));
        if (!canPlace) {
          newTray[0] = BLOCK_SHAPES[0];
        }

        this.tray = newTray;
        this.renderTray();
        this.checkAvailableMoves();
      }

      canPlaceAt(matrix, startX, startY) {
        const h = matrix.length;
        const w = matrix[0].length;

        for (let r = 0; r < h; r++) {
          for (let c = 0; c < w; c++) {
            if (matrix[r][c] === 1) {
              const targetX = startX + c;
              const targetY = startY + r;

              if (targetX < 0 || targetX >= 9 || targetY < 0 || targetY >= 9) {
                return false;
              }
              if (this.board[targetY][targetX] === 1) {
                return false;
              }
            }
          }
        }
        return true;
      }

      canPlaceSomewhere(shape) {
        if (!shape) return false;
        for (let y = 0; y < 9; y++) {
          for (let x = 0; x < 9; x++) {
            if (this.canPlaceAt(shape.matrix, x, y)) {
              return true;
            }
          }
        }
        return false;
      }

      checkAvailableMoves() {
        let anyCanPlace = false;
        let placeableCount = 0;
        let remainingPiecesCount = 0;

        for (let i = 0; i < 3; i++) {
          const shape = this.tray[i];
          const slotEl = document.getElementById(`slot-${i}`);
          if (shape && slotEl) {
            remainingPiecesCount++;
            const fits = this.canPlaceSomewhere(shape);
            const blockEl = slotEl.querySelector('.tray-block');
            if (blockEl) {
              if (fits) {
                blockEl.classList.remove('disabled');
                anyCanPlace = true;
                placeableCount++;
              } else {
                blockEl.classList.add('disabled');
              }
            }
          }
        }

        const hasPieces = remainingPiecesCount > 0;
        if (hasPieces && !anyCanPlace) {
          this.triggerGameOver();
          return;
        }

        const occupancy = this.getOccupancyRatio();
        const isTight = (occupancy >= 0.70) || (remainingPiecesCount >= 2 && placeableCount === 1);

        if (isTight && !this.dangerWarned && !this.isGameOver) {
          this.dangerWarned = true;
          this.showCautionWarning();
        } else if (occupancy < 0.55 && this.dangerWarned) {
          this.dangerWarned = false;
        }
      }

      showCautionWarning() {
        const toast = document.getElementById('caution-toast');
        if (!toast) return;

        if (this.cautionTimer) {
          clearTimeout(this.cautionTimer);
        }

        toast.classList.add('show');
        this.cautionTimer = setTimeout(() => {
          toast.classList.remove('show');
          this.cautionTimer = null;
        }, 2600);
      }

      hideCautionWarning() {
        const toast = document.getElementById('caution-toast');
        if (toast) toast.classList.remove('show');
        if (this.cautionTimer) {
          clearTimeout(this.cautionTimer);
          this.cautionTimer = null;
        }
      }

      evaluateClears() {
        const rowsToClear = [];
        const colsToClear = [];
        const squaresToClear = [];
        const uniqueCells = new Set();

        // 1. Rows
        for (let y = 0; y < 9; y++) {
          if (this.board[y].every(v => v === 1)) {
            rowsToClear.push(y);
            for (let x = 0; x < 9; x++) uniqueCells.add(`${x},${y}`);
          }
        }

        // 2. Columns
        for (let x = 0; x < 9; x++) {
          let colFull = true;
          for (let y = 0; y < 9; y++) {
            if (this.board[y][x] === 0) {
              colFull = false;
              break;
            }
          }
          if (colFull) {
            colsToClear.push(x);
            for (let y = 0; y < 9; y++) uniqueCells.add(`${x},${y}`);
          }
        }

        // 3. 3x3 Squares
        for (let s = 0; s < 9; s++) {
          const startX = (s % 3) * 3;
          const startY = Math.floor(s / 3) * 3;
          let squareFull = true;

          for (let dy = 0; dy < 3; dy++) {
            for (let dx = 0; dx < 3; dx++) {
              if (this.board[startY + dy][startX + dx] === 0) {
                squareFull = false;
                break;
              }
            }
            if (!squareFull) break;
          }

          if (squareFull) {
            squaresToClear.push(s);
            for (let dy = 0; dy < 3; dy++) {
              for (let dx = 0; dx < 3; dx++) {
                uniqueCells.add(`${startX + dx},${startY + dy}`);
              }
            }
          }
        }

        return {
          totalUnits: rowsToClear.length + colsToClear.length + squaresToClear.length,
          cells: Array.from(uniqueCells).map(str => {
            const [x, y] = str.split(',').map(Number);
            return { x, y };
          })
        };
      }

      placeBlock(slotIndex, startX, startY) {
        const shape = this.tray[slotIndex];
        if (!shape || !this.canPlaceAt(shape.matrix, startX, startY)) return false;

        // Save snapshot right before placing
        this.captureSnapshot();

        const h = shape.matrix.length;
        const w = shape.matrix[0].length;
        let placedTileCount = 0;

        for (let r = 0; r < h; r++) {
          for (let c = 0; c < w; c++) {
            if (shape.matrix[r][c] === 1) {
              this.board[startY + r][startX + c] = 1;
              placedTileCount++;
            }
          }
        }

        this.addScore(placedTileCount);
        sound.playPlace();

        if (navigator.vibrate) {
          navigator.vibrate(15);
        }

        this.tray[slotIndex] = null;
        this.renderTraySlot(slotIndex);

        const clearResult = this.evaluateClears();

        if (clearResult.totalUnits > 0) {
          this.streak++;
          this.updateStreakBadge();

          const unitBase = 18;
          let comboMultiplier = 1.0;
          if (clearResult.totalUnits === 2) comboMultiplier = 2.0;
          else if (clearResult.totalUnits === 3) comboMultiplier = 3.5;
          else if (clearResult.totalUnits >= 4) comboMultiplier = 5.0 + (clearResult.totalUnits - 4) * 2.0;

          let streakMultiplier = 1.0;
          if (this.streak === 2) streakMultiplier = 1.5;
          else if (this.streak === 3) streakMultiplier = 2.0;
          else if (this.streak >= 4) streakMultiplier = 2.5 + (this.streak - 4) * 0.5;

          const clearScore = Math.round(clearResult.totalUnits * unitBase * comboMultiplier * streakMultiplier);
          this.addScore(clearScore);

          sound.playClear(this.streak, clearResult.totalUnits);
          this.triggerClearAnimation(clearResult.cells, clearResult.totalUnits, clearScore);

          if (navigator.vibrate) {
            navigator.vibrate([40, 25, 50]);
          }
        } else {
          this.streak = 0;
          this.updateStreakBadge();
        }

        this.renderBoard();

        if (this.tray.every(p => p === null)) {
          this.spawnTraySet();
        } else {
          this.checkAvailableMoves();
        }

        this.saveGameSession();
        return true;
      }

      addScore(pts) {
        this.score += pts;
        if (this.score > this.highScore) {
          this.highScore = this.score;
          localStorage.setItem('blockudoku_high_score', this.highScore.toString());
          document.getElementById('high-score').textContent = this.highScore;
        }
        this.updateScoreDisplay();
      }

      updateScoreDisplay() {
        document.getElementById('current-score').textContent = this.score;
      }

      updateStreakBadge() {
        const badge = document.getElementById('streak-container');
        const count = document.getElementById('streak-count');
        if (this.streak > 1) {
          count.textContent = this.streak;
          badge.classList.remove('opacity-0');
        } else {
          badge.classList.add('opacity-0');
        }
      }

      triggerClearAnimation(cells, totalUnits, pointsGained) {
        const boardEl = document.getElementById('board');
        boardEl.classList.add('screen-shake');
        setTimeout(() => boardEl.classList.remove('screen-shake'), 240);

        cells.forEach(({ x, y }) => {
          const cellEl = document.querySelector(`.cell[data-x="${x}"][data-y="${y}"]`);
          if (cellEl) {
            cellEl.classList.add('clearing');
            setTimeout(() => {
              this.board[y][x] = 0;
              cellEl.classList.remove('clearing', 'occupied');
            }, 300);
          }
        });

        setTimeout(() => {
          const isAllCleared = this.board.every(row => row.every(val => val === 0));
          if (isAllCleared) {
            this.triggerAllClear();
          }
        }, 310);

        const feedbackLayer = document.getElementById('feedback-layer');
        const popup = document.createElement('div');
        popup.className = 'score-popup text-lg sm:text-xl font-black';
        popup.style.left = '50%';
        popup.style.top = '45%';

        let text = `+${pointsGained}`;
        if (totalUnits > 1) text += ` • COMBO x${totalUnits}!`;
        if (this.streak > 1) text += ` • STREAK x${this.streak}!`;
        popup.textContent = text;

        feedbackLayer.appendChild(popup);
        setTimeout(() => popup.remove(), 850);
      }

      triggerAllClear() {
        const bonusScore = 100;
        this.addScore(bonusScore);
        sound.playAllClear();

        if (navigator.vibrate) {
          navigator.vibrate([50, 40, 60, 40, 100]);
        }

        for (let y = 0; y < 9; y++) {
          for (let x = 0; x < 9; x++) {
            const cellEl = document.querySelector(`.cell[data-x="${x}"][data-y="${y}"]`);
            if (cellEl) {
              const delay = y * 55 + (x % 3) * 15;
              setTimeout(() => {
                cellEl.classList.add('wave-tile');
                setTimeout(() => {
                  cellEl.classList.remove('wave-tile');
                }, 600);
              }, delay);
            }
          }
        }

        const feedbackLayer = document.getElementById('feedback-layer');
        const banner = document.createElement('div');
        banner.className = 'all-clear-banner';
        banner.innerHTML = `
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-star text-amber-400 text-sm animate-spin"></i>
            <span class="text-2xl font-black tracking-wider text-amber-400">ALL CLEAR!</span>
            <i class="fa-solid fa-star text-amber-400 text-sm animate-spin"></i>
          </div>
          <div class="flex items-center gap-1.5 mt-1">
            <span class="text-xl font-black text-sky-400">+100</span>
            <span class="text-xs font-black tracking-widest text-amber-300 uppercase">BONUS</span>
          </div>
        `;

        feedbackLayer.appendChild(banner);
        setTimeout(() => banner.remove(), 2300);
        this.saveGameSession();
      }

      triggerGameOver() {
        this.isGameOver = true;
        this.hideCautionWarning();
        sound.playGameOver();
        if (navigator.vibrate) {
          navigator.vibrate([80, 50, 80, 50, 160]);
        }

        document.getElementById('final-score').textContent = this.score;
        document.getElementById('final-high-score').textContent = this.highScore;

        // Configure Revive Button with dynamic penalty cost tag
        const reviveBtn = document.getElementById('revive-btn');
        const costTag = document.getElementById('revive-cost-tag');
        if (reviveBtn && this.historySnapshot) {
          reviveBtn.style.display = 'flex';
          const penalty = Math.min(this.reviveCost, this.historySnapshot.score);
          if (costTag) {
            costTag.textContent = penalty > 0 ? `-${penalty} P` : '무료';
          }
        } else if (reviveBtn) {
          reviveBtn.style.display = 'none';
        }

        const modal = document.getElementById('game-over-modal');
        modal.classList.remove('hidden');
        setTimeout(() => {
          modal.classList.add('opacity-100');
          document.getElementById('modal-box').classList.remove('scale-95');
        }, 20);
      }

      renderBoard() {
        for (let y = 0; y < 9; y++) {
          for (let x = 0; x < 9; x++) {
            const cellEl = document.querySelector(`.cell[data-x="${x}"][data-y="${y}"]`);
            if (cellEl) {
              if (this.board[y][x] === 1) {
                cellEl.classList.add('occupied');
              } else {
                cellEl.classList.remove('occupied');
              }
            }
          }
        }
      }

      renderTray() {
        for (let i = 0; i < 3; i++) {
          this.renderTraySlot(i);
        }
      }

      renderTraySlot(slotIndex) {
        const slotEl = document.getElementById(`slot-${slotIndex}`);
        slotEl.innerHTML = '';
        const shape = this.tray[slotIndex];
        if (!shape) return;

        const blockEl = document.createElement('div');
        blockEl.className = 'tray-block';
        blockEl.dataset.slot = slotIndex;

        const h = shape.matrix.length;
        const w = shape.matrix[0].length;
        blockEl.style.gridTemplateColumns = `repeat(${w}, 1fr)`;
        blockEl.style.gridTemplateRows = `repeat(${h}, 1fr)`;

        const cellSize = 15;
        blockEl.style.width = `${w * cellSize + (w - 1) * 3}px`;
        blockEl.style.height = `${h * cellSize + (h - 1) * 3}px`;

        for (let r = 0; r < h; r++) {
          for (let c = 0; c < w; c++) {
            const miniCell = document.createElement('div');
            if (shape.matrix[r][c] === 1) {
              miniCell.className = 'mini-cell w-full h-full';
            } else {
              miniCell.style.visibility = 'hidden';
            }
            blockEl.appendChild(miniCell);
          }
        }

        slotEl.appendChild(blockEl);
      }

      bindEvents() {
        const boardEl = document.getElementById('board');

        const handleStart = (e) => {
          if (this.isGameOver) return;
          sound.init();

          const target = e.target.closest('.tray-block');
          if (!target || target.classList.contains('disabled')) return;

          const slotIndex = parseInt(target.dataset.slot, 10);
          this.draggedSlotIndex = slotIndex;
          this.draggedShape = this.tray[slotIndex];
          if (!this.draggedShape) return;

          sound.playGrab();

          const boardCellSize = boardEl.clientWidth / 9;
          this.prepareDragClone(this.draggedShape, boardCellSize);

          target.style.opacity = '0';
          const pos = this.getEventPos(e);
          this.updateDragClonePosition(pos.clientX, pos.clientY);

          window.addEventListener('pointermove', handleMove, { passive: false });
          window.addEventListener('pointerup', handleEnd);
          window.addEventListener('pointercancel', handleEnd);
        };

        const handleMove = (e) => {
          if (this.draggedSlotIndex === null) return;
          e.preventDefault();
          const pos = this.getEventPos(e);
          this.updateDragClonePosition(pos.clientX, pos.clientY);
          this.updateGhostPreview(pos.clientX, pos.clientY - this.touchOffsetY);
        };

        const handleEnd = () => {
          window.removeEventListener('pointermove', handleMove);
          window.removeEventListener('pointerup', handleEnd);
          window.removeEventListener('pointercancel', handleEnd);

          if (this.draggedSlotIndex === null) return;

          this.dragClone.style.display = 'none';
          this.clearGhostPreview();

          const slotEl = document.getElementById(`slot-${this.draggedSlotIndex}`);
          const originalBlock = slotEl ? slotEl.querySelector('.tray-block') : null;

          if (this.currentHoverCoords) {
            const placed = this.placeBlock(
              this.draggedSlotIndex,
              this.currentHoverCoords.x,
              this.currentHoverCoords.y
            );
            if (!placed && originalBlock) {
              originalBlock.style.opacity = '1';
            }
          } else {
            if (originalBlock) originalBlock.style.opacity = '1';
          }

          this.draggedSlotIndex = null;
          this.draggedShape = null;
          this.currentHoverCoords = null;
        };

        document.querySelector('footer').addEventListener('pointerdown', handleStart);

        // Sound Toggle
        const soundBtn = document.getElementById('sound-toggle-btn');
        soundBtn.addEventListener('click', () => {
          sound.enabled = !sound.enabled;
          document.getElementById('sound-icon').className = sound.enabled
            ? 'fa-solid fa-volume-high text-xs'
            : 'fa-solid fa-volume-xmark text-xs text-slate-400';
        });

        // Quick Reset Confirmation modal
        const quickResetBtn = document.getElementById('quick-reset-btn');
        const resetModal = document.getElementById('reset-confirm-modal');
        const cancelResetBtn = document.getElementById('cancel-reset-btn');
        const confirmResetBtn = document.getElementById('confirm-reset-btn');

        quickResetBtn.addEventListener('click', () => {
          resetModal.classList.remove('hidden');
          setTimeout(() => resetModal.classList.add('opacity-100'), 10);
        });

        cancelResetBtn.addEventListener('click', () => {
          resetModal.classList.remove('opacity-100');
          setTimeout(() => resetModal.classList.add('hidden'), 200);
        });

        confirmResetBtn.addEventListener('click', () => {
          resetModal.classList.remove('opacity-100');
          setTimeout(() => resetModal.classList.add('hidden'), 200);
          this.startNewGame();
        });

        // Game Over Revive & Restart
        document.getElementById('revive-btn').addEventListener('click', () => {
          this.reviveAndContinue();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
          this.startNewGame();
        });
      }

      getEventPos(e) {
        return { clientX: e.clientX, clientY: e.clientY };
      }

      prepareDragClone(shape, cellSize) {
        const h = shape.matrix.length;
        const w = shape.matrix[0].length;
        const gap = 3;

        this.dragClone.innerHTML = '';
        this.dragClone.style.display = 'grid';
        this.dragClone.style.gridTemplateColumns = `repeat(${w}, 1fr)`;
        this.dragClone.style.gridTemplateRows = `repeat(${h}, 1fr)`;
        this.dragClone.style.gap = `${gap}px`;

        const totalWidth = w * cellSize + (w - 1) * gap;
        const totalHeight = h * cellSize + (h - 1) * gap;
        this.dragClone.style.width = `${totalWidth}px`;
        this.dragClone.style.height = `${totalHeight}px`;

        for (let r = 0; r < h; r++) {
          for (let c = 0; c < w; c++) {
            const cell = document.createElement('div');
            if (shape.matrix[r][c] === 1) {
              cell.className = 'w-full h-full rounded-[5px] bg-gradient-to-br from-blue-500 to-blue-700 shadow-md border border-blue-800';
            } else {
              cell.style.visibility = 'hidden';
            }
            this.dragClone.appendChild(cell);
          }
        }
      }

      updateDragClonePosition(clientX, clientY) {
        const w = parseFloat(this.dragClone.style.width);
        const h = parseFloat(this.dragClone.style.height);
        this.dragClone.style.left = `${clientX - w / 2}px`;
        this.dragClone.style.top = `${clientY - this.touchOffsetY - h / 2}px`;
      }

      updateGhostPreview(clientX, clientY) {
        this.clearGhostPreview();
        const boardEl = document.getElementById('board');
        const rect = boardEl.getBoundingClientRect();

        if (
          clientX < rect.left ||
          clientX > rect.right ||
          clientY < rect.top ||
          clientY > rect.bottom
        ) {
          this.currentHoverCoords = null;
          return;
        }

        const cellW = rect.width / 9;
        const cellH = rect.height / 9;

        const shape = this.draggedShape;
        const shapeW = shape.matrix[0].length;
        const shapeH = shape.matrix.length;

        const relX = clientX - rect.left;
        const relY = clientY - rect.top;

        const gridX = Math.round((relX - (shapeW * cellW) / 2) / cellW);
        const gridY = Math.round((relY - (shapeH * cellH) / 2) / cellH);

        if (this.canPlaceAt(shape.matrix, gridX, gridY)) {
          this.currentHoverCoords = { x: gridX, y: gridY };

          for (let r = 0; r < shapeH; r++) {
            for (let c = 0; c < shapeW; c++) {
              if (shape.matrix[r][c] === 1) {
                const cell = document.querySelector(`.cell[data-x="${gridX + c}"][data-y="${gridY + r}"]`);
                if (cell) cell.classList.add('ghost-valid');
              }
            }
          }

          this.highlightAnticipatedClears(shape.matrix, gridX, gridY);
        } else {
          this.currentHoverCoords = null;
        }
      }

      highlightAnticipatedClears(matrix, startX, startY) {
        const sim = this.board.map(row => [...row]);
        const h = matrix.length;
        const w = matrix[0].length;

        for (let r = 0; r < h; r++) {
          for (let c = 0; c < w; c++) {
            if (matrix[r][c] === 1) sim[startY + r][startX + c] = 1;
          }
        }

        const willClearCells = new Set();

        for (let y = 0; y < 9; y++) {
          if (sim[y].every(v => v === 1)) {
            for (let x = 0; x < 9; x++) willClearCells.add(`${x},${y}`);
          }
        }

        for (let x = 0; x < 9; x++) {
          if (sim.every(row => row[x] === 1)) {
            for (let y = 0; y < 9; y++) willClearCells.add(`${x},${y}`);
          }
        }

        for (let s = 0; s < 9; s++) {
          const sx = (s % 3) * 3;
          const sy = Math.floor(s / 3) * 3;
          let full = true;
          for (let dy = 0; dy < 3; dy++) {
            for (let dx = 0; dx < 3; dx++) {
              if (sim[sy + dy][sx + dx] === 0) { full = false; break; }
            }
            if (!full) break;
          }
          if (full) {
            for (let dy = 0; dy < 3; dy++) {
              for (let dx = 0; dx < 3; dx++) willClearCells.add(`${sx + dx},${sy + dy}`);
            }
          }
        }

        willClearCells.forEach(coord => {
          const [x, y] = coord.split(',').map(Number);
          const cell = document.querySelector(`.cell[data-x="${x}"][data-y="${y}"]`);
          if (cell) cell.classList.add('will-clear');
        });
      }

      clearGhostPreview() {
        document.querySelectorAll('.cell.ghost-valid').forEach(el => el.classList.remove('ghost-valid'));
        document.querySelectorAll('.cell.will-clear').forEach(el => el.classList.remove('will-clear'));
      }
    }

    window.onload = () => {
      new ThemeManager();
      window.gameInstance = new BlockudokuGame();
    };
  </script>
</body>
</html>
