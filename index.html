<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Blockudoku</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          }
        }
      }
    };
  </script>
  <style>
    * {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      box-sizing: border-box;
    }

    :root {
      --bg-main: #f5f6f8;
      --board-border: #cfd7e3;
      --board-inner-line: #dde3ea;
      --board-sector-line: #b6c3d4;
      --cell-white: #ffffff;
      --cell-tint: #edf1f7;
      --text-score: #2c3340;
      --text-sub: #8e9aab;

      /* 동적 블록 테마 변수 (스크립트에서 매 판 랜덤 교체) */
      --theme-from: #54b4eb;
      --theme-to: #399cd7;
      --theme-border: #2c84bc;
      --theme-glow: rgba(57, 156, 215, 0.45);
      --theme-ghost: rgba(57, 156, 215, 0.28);
    }

    html.dark {
      --bg-main: #0c111c;
      --board-border: #232d3f;
      --board-inner-line: #1a2232;
      --board-sector-line: #2e3c54;
      --cell-white: #131a27;
      --cell-tint: #0f1520;
      --text-score: #f1f5f9;
      --text-sub: #64748b;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-score);
      transition: background-color 0.25s ease;
      overflow: hidden;
      touch-action: none;
    }

    /* 실제 게임과 1:1 일치하는 완벽한 9x9 일체형 보드 프레임 */
    .board-frame {
      background-color: var(--board-border);
      padding: 2.5px;
      border-radius: 8px;
      box-shadow: 0 4px 16px -2px rgba(0, 0, 0, 0.06);
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 380px;
      position: relative;
    }

    .board-table {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      grid-template-rows: repeat(9, 1fr);
      gap: 1.5px;
      background-color: var(--board-inner-line);
      border-radius: 6px;
      overflow: hidden;
    }

    /* 셀 스타일링 - 틈새 없는 일체형 스도쿠 그리드 */
    .grid-cell {
      background-color: var(--cell-white);
      position: relative;
      transition: background 0.12s ease, filter 0.15s ease;
    }

    .grid-cell.tint-zone {
      background-color: var(--cell-tint);
    }

    /* 3x3 스도쿠 구역 분할선 두께 강조 */
    .grid-cell.sector-border-r {
      border-right: 2px solid var(--board-sector-line) !important;
    }
    .grid-cell.sector-border-b {
      border-bottom: 2px solid var(--board-sector-line) !important;
    }

    /* 배치된 블록 타일 (실제 게임의 입체 베벨 & 이음새 질감) */
    .grid-cell.occupied {
      background: linear-gradient(145deg, var(--theme-from) 0%, var(--theme-to) 100%) !important;
      border: 1px solid var(--theme-border) !important;
      box-shadow: inset 1px 1px 1.5px rgba(255, 255, 255, 0.6), inset -1px -1px 2px rgba(0, 0, 0, 0.15);
      border-radius: 2px;
      z-index: 2;
    }

    /* 반투명 고스트 프리뷰 */
    .grid-cell.ghost-hover {
      background: var(--theme-ghost) !important;
      outline: 2px dashed var(--theme-border);
      outline-offset: -2px;
      z-index: 4;
    }

    /* 지워질 라인 예측 하이라이트 (Anticipation) */
    .grid-cell.anticipate-clear {
      animation: pulse-anticipate 0.35s infinite alternate ease-in-out;
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%) !important;
      border-color: #d97706 !important;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
      z-index: 6;
    }

    @keyframes pulse-anticipate {
      0% { opacity: 0.75; transform: scale(0.97); }
      100% { opacity: 1; transform: scale(1.02); }
    }

    /* 타일 제거 폭발 이펙트 */
    .grid-cell.clearing {
      animation: burst-clear 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      z-index: 10;
    }

    @keyframes burst-clear {
      0% { transform: scale(1); filter: brightness(1.8); }
      40% { transform: scale(1.15); opacity: 0.9; box-shadow: 0 0 15px var(--theme-glow); }
      100% { transform: scale(0.2); opacity: 0; }
    }

    /* 올 클리어 파도타기 애니메이션 */
    .grid-cell.wave-tile {
      animation: wave-cascade 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      z-index: 12;
    }

    @keyframes wave-cascade {
      0% { transform: translateY(0); }
      35% {
        transform: translateY(-5px);
        background: linear-gradient(145deg, var(--theme-from) 0%, var(--theme-to) 100%) !important;
        box-shadow: 0 6px 14px var(--theme-glow);
        filter: brightness(1.3);
      }
      100% { transform: translateY(0); }
    }

    /* 하단 트레이 (슬롯 상자 없는 투명 플로팅 디자인) */
    .tray-wrapper {
      width: 100%;
      max-width: 380px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      justify-items: center;
      min-height: 120px;
    }

    .tray-slot {
      width: 100%;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;
      opacity: 1;
      transition: opacity 0.15s ease, filter 0.15s ease;
    }

    .tray-slot:active {
      cursor: grabbing;
    }

    .tray-slot.disabled {
      opacity: 0.25 !important;
      filter: grayscale(0.85);
      cursor: not-allowed;
      pointer-events: none;
    }

    /* 실제 게임 블록 타일 모양 */
    .block-tile {
      background: linear-gradient(145deg, var(--theme-from) 0%, var(--theme-to) 100%) !important;
      border: 1px solid var(--theme-border) !important;
      box-shadow: inset 1px 1px 1.5px rgba(255, 255, 255, 0.65), inset -1px -1px 2px rgba(0, 0, 0, 0.18);
      border-radius: 3px;
      opacity: 1 !important;
    }

    /* 드래그 중인 둥둥 떠다니는 블록 */
    #drag-proxy {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      display: none;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.25));
    }

    /* 신중하게 움직이세요 알림 */
    .caution-pill {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translate(-50%, -15px);
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
      color: #ffffff;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: -0.01em;
      box-shadow: 0 8px 16px rgba(234, 88, 12, 0.35);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .caution-pill.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* ALL CLEAR 축하 배너 */
    .all-clear-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      opacity: 0;
      pointer-events: none;
      z-index: 70;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px 30px;
      border-radius: 20px;
      background: rgba(22, 28, 40, 0.94);
      border: 2px solid #f59e0b;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), 0 0 30px rgba(245, 158, 11, 0.4);
      color: #ffffff;
      animation: banner-pop 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes banner-pop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
      18% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
      28% { transform: translate(-50%, -50%) scale(1); }
      75% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -60%) scale(0.95); }
    }

    /* 점수 팝업 애니메이션 */
    .score-popup {
      position: absolute;
      pointer-events: none;
      font-weight: 900;
      animation: float-score 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      z-index: 55;
    }

    @keyframes float-score {
      0% { opacity: 0; transform: translate(-50%, -30%) scale(0.7); }
      20% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
      100% { opacity: 0; transform: translate(-50%, -100%) scale(1); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between max-w-md mx-auto px-4 py-3 select-none">

  <!-- 미니 헤더 툴바 (사운드, 테마, 재시작) -->
  <div class="w-full flex items-center justify-between pt-1">
    <div class="flex items-center gap-2">
      <!-- 테마 컬러 인디케이터 배지 -->
      <div id="theme-color-indicator" class="w-3.5 h-3.5 rounded-full shadow-inner border border-white/60"></div>
      <span id="theme-color-name" class="text-[11px] font-extrabold uppercase tracking-wider text-slate-400">Classic Blue</span>
    </div>
    <div class="flex items-center gap-3 text-slate-400">
      <button id="btn-sound" class="p-1 hover:text-slate-600 dark:hover:text-slate-200 transition" aria-label="사운드 토글">
        <i id="icon-sound" class="fa-solid fa-volume-high text-sm"></i>
      </button>
      <button id="btn-theme" class="p-1 hover:text-slate-600 dark:hover:text-slate-200 transition" aria-label="다크 모드 토글">
        <i id="icon-theme" class="fa-solid fa-sun text-sm text-amber-500"></i>
      </button>
      <button id="btn-restart" class="p-1 hover:text-slate-600 dark:hover:text-slate-200 transition" aria-label="새 판 시작">
        <i class="fa-solid fa-rotate-right text-sm"></i>
      </button>
    </div>
  </div>

  <!-- 실제 게임과 똑같은 심플 & 클린 스코어보드 -->
  <header class="w-full flex flex-col items-center mt-1 mb-2">
    <!-- 거대한 메인 점수 (실제 앱 스타일) -->
    <div id="score-display" class="text-6xl font-normal tracking-tight tabular-nums py-1 leading-none">
      0
    </div>

    <!-- 좌/우 서브 기록 (목표 / 최고 기록) -->
    <div class="w-full flex items-center justify-between px-2 mt-1">
      <div class="flex flex-col items-start">
        <span class="text-xs font-medium text-slate-400">목표</span>
        <div class="flex items-center gap-1.5 text-slate-700 dark:text-slate-200 font-bold text-sm">
          <i class="fa-solid fa-circle-check text-sky-500 text-xs"></i>
          <span id="target-score">1000</span>
        </div>
      </div>
      <div class="flex flex-col items-end">
        <span class="text-xs font-medium text-slate-400">최고 기록</span>
        <div class="flex items-center gap-1.5 text-slate-700 dark:text-slate-200 font-bold text-sm">
          <i class="fa-solid fa-trophy text-amber-500 text-xs"></i>
          <span id="best-score">0</span>
        </div>
      </div>
    </div>
  </header>

  <!-- 메인 보드 그리드 (실제 게임 규격 모사) -->
  <main class="w-full flex items-center justify-center my-auto relative">
    <div id="board-container" class="board-frame">
      <div id="board-grid" class="board-table">
        <!-- 81개 스도쿠 셀 -->
      </div>
      <!-- 신중하게 움직이세요 토스트 -->
      <div id="caution-toast" class="caution-pill">
        <i class="fa-solid fa-triangle-exclamation mr-1 text-xs"></i>
        <span>신중하게 움직이세요!</span>
      </div>
      <!-- 피드백 / 폭발 애니메이션 레이어 -->
      <div id="feedback-layer" class="absolute inset-0 pointer-events-none overflow-hidden"></div>
    </div>
  </main>

  <!-- 하단 트레이 (슬롯 네모 박스를 없앤 깔끔한 오리지널 스타일) -->
  <footer class="w-full flex justify-center pb-4">
    <div class="tray-wrapper">
      <div class="tray-slot" id="slot-0" data-slot="0"></div>
      <div class="tray-slot" id="slot-1" data-slot="1"></div>
      <div class="tray-slot" id="slot-2" data-slot="2"></div>
    </div>
  </footer>

  <!-- 드래그 부유 프록시 엘리먼트 -->
  <div id="drag-proxy"></div>

  <!-- 게임 오버 모달 -->
  <div id="game-over-modal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-200">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 w-full max-w-xs text-center shadow-2xl scale-95 transform transition-transform duration-200" id="modal-card">
      <div class="w-14 h-14 rounded-2xl bg-rose-500/10 text-rose-500 mx-auto flex items-center justify-center text-2xl mb-3">
        <i class="fa-solid fa-shapes"></i>
      </div>
      <h3 class="text-xl font-black mb-1">게임 오버</h3>
      <p class="text-xs text-slate-500 dark:text-slate-400 mb-4">더 이상 배치할 수 있는 자리가 없습니다!</p>

      <div class="bg-slate-100 dark:bg-slate-800/60 rounded-2xl p-3.5 mb-4">
        <span class="text-xs font-semibold text-slate-400">최종 점수</span>
        <div id="modal-score" class="text-3xl font-black mt-0.5">0</div>
      </div>

      <div class="flex flex-col gap-2">
        <button id="btn-newgame" class="w-full py-3 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white font-extrabold rounded-xl text-sm shadow-md active:scale-95 transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-rotate-right"></i>
          <span>새 게임 시작</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================
       1. 다채로운 블록 테마 팔레트 (매 게임마다 무작위 변경)
       ========================================================== */
    const COLOR_PALETTES = [
      {
        name: 'Classic Sky',
        from: '#54b4eb',
        to: '#399cd7',
        border: '#2c84bc',
        glow: 'rgba(57, 156, 215, 0.55)',
        ghost: 'rgba(57, 156, 215, 0.32)'
      },
      {
        name: 'Emerald Mint',
        from: '#34d399',
        to: '#059669',
        border: '#047857',
        glow: 'rgba(16, 185, 129, 0.55)',
        ghost: 'rgba(16, 185, 129, 0.32)'
      },
      {
        name: 'Amber Coral',
        from: '#fb923c',
        to: '#ea580c',
        border: '#c2410c',
        glow: 'rgba(234, 88, 12, 0.55)',
        ghost: 'rgba(234, 88, 12, 0.32)'
      },
      {
        name: 'Amethyst Violet',
        from: '#a78bfa',
        to: '#7c3aed',
        border: '#6d28d9',
        glow: 'rgba(124, 58, 237, 0.55)',
        ghost: 'rgba(124, 58, 237, 0.32)'
      },
      {
        name: 'Rose Berry',
        from: '#f472b6',
        to: '#db2777',
        border: '#be185d',
        glow: 'rgba(219, 39, 119, 0.55)',
        ghost: 'rgba(219, 39, 119, 0.32)'
      },
      {
        name: 'Electric Cyan',
        from: '#22d3ee',
        to: '#0891b2',
        border: '#0e7490',
        glow: 'rgba(8, 145, 178, 0.55)',
        ghost: 'rgba(8, 145, 178, 0.32)'
      }
    ];

    /* ==========================================================
       2. Web Audio 사운드 신디사이저
       ========================================================== */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, type = 'sine', duration = 0.1, gainVal = 0.14) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }

      playPlace() {
        this.playTone(320, 'triangle', 0.08, 0.16);
      }

      playGrab() {
        this.playTone(460, 'sine', 0.04, 0.08);
      }

      playClear(count = 1) {
        const notes = [392, 440, 523.25, 587.33, 659.25, 783.99];
        for (let i = 0; i < Math.min(count, notes.length); i++) {
          setTimeout(() => {
            this.playTone(notes[i], 'triangle', 0.18, 0.18);
          }, i * 50);
        }
      }

      playAllClear() {
        const arpeggio = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
        arpeggio.forEach((pitch, idx) => {
          setTimeout(() => this.playTone(pitch, 'sine', 0.26, 0.18), idx * 65);
        });
      }

      playGameOver() {
        this.playTone(280, 'sawtooth', 0.2, 0.15);
        setTimeout(() => this.playTone(210, 'sawtooth', 0.25, 0.15), 130);
        setTimeout(() => this.playTone(150, 'sawtooth', 0.35, 0.18), 260);
      }
    }

    const sound = new SoundEngine();

    /* ==========================================================
       3. 정통 블록 셰이프 (3x3 블록 완전 제거 & 티어 분류 적용)
       ========================================================== */
    const BLOCK_SHAPES = [
      // Tier 1: 안전/소형 블록 (1~3칸)
      { id: '1x1', tier: 1, matrix: [[1]] },
      { id: '1x2', tier: 1, matrix: [[1, 1]] },
      { id: '2x1', tier: 1, matrix: [[1], [1]] },
      { id: '1x3', tier: 1, matrix: [[1, 1, 1]] },
      { id: '3x1', tier: 1, matrix: [[1], [1], [1]] },
      { id: 'L-2-1', tier: 1, matrix: [[1, 0], [1, 1]] },
      { id: 'L-2-2', tier: 1, matrix: [[0, 1], [1, 1]] },
      { id: 'L-2-3', tier: 1, matrix: [[1, 1], [1, 0]] },
      { id: 'L-2-4', tier: 1, matrix: [[1, 1], [0, 1]] },

      // Tier 2: 일반 테트로미노 (4칸)
      { id: '1x4', tier: 2, matrix: [[1, 1, 1, 1]] },
      { id: '4x1', tier: 2, matrix: [[1], [1], [1], [1]] },
      { id: '2x2', tier: 2, matrix: [[1, 1], [1, 1]] },
      { id: 'T-4-1', tier: 2, matrix: [[1, 1, 1], [0, 1, 0]] },
      { id: 'T-4-2', tier: 2, matrix: [[0, 1, 0], [1, 1, 1]] },
      { id: 'T-4-3', tier: 2, matrix: [[1, 0], [1, 1], [1, 0]] },
      { id: 'T-4-4', tier: 2, matrix: [[0, 1], [1, 1], [0, 1]] },
      { id: 'Z-4-1', tier: 2, matrix: [[1, 1, 0], [0, 1, 1]] },
      { id: 'S-4-1', tier: 2, matrix: [[0, 1, 1], [1, 1, 0]] },

      // Tier 3: 고난도 펜토미노 & 대형 코너 (5칸 이상, 난이도 상향용)
      { id: '1x5', tier: 3, matrix: [[1, 1, 1, 1, 1]] },
      { id: '5x1', tier: 3, matrix: [[1], [1], [1], [1], [1]] },
      { id: 'L-3-1', tier: 3, matrix: [[1, 0, 0], [1, 0, 0], [1, 1, 1]] },
      { id: 'L-3-2', tier: 3, matrix: [[0, 0, 1], [0, 0, 1], [1, 1, 1]] },
      { id: 'L-3-3', tier: 3, matrix: [[1, 1, 1], [1, 0, 0], [1, 0, 0]] },
      { id: 'L-3-4', tier: 3, matrix: [[1, 1, 1], [0, 0, 1], [0, 0, 1]] }
    ];

    /* ==========================================================
       4. Blockudoku 코어 게임 클래스
       ========================================================== */
    class Blockudoku {
      constructor() {
        this.board = Array(9).fill(null).map(() => Array(9).fill(0));
        this.tray = [null, null, null];
        this.score = 0;
        this.bestScore = parseInt(localStorage.getItem('blockudoku_best') || '0', 10);
        this.streak = 0;
        this.isGameOver = false;
        this.currentPalette = COLOR_PALETTES[0];

        // 드래그 상태
        this.dragSlotIndex = null;
        this.dragShape = null;
        this.hoverCoords = null;
        this.touchOffsetY = 75; // 모바일 손가락 가림 방지 오프셋

        this.initThemeMode();
        this.initDOM();
        this.bindEvents();

        // 저장된 판이 있으면 복원, 없으면 새 게임
        if (!this.loadSession()) {
          this.startNewGame();
        }
      }

      initThemeMode() {
        // 기본 시작은 라이트 모드
        const saved = localStorage.getItem('blockudoku_theme_mode');
        if (saved === 'dark') {
          document.documentElement.classList.add('dark');
          document.getElementById('icon-theme').className = 'fa-solid fa-moon text-sm text-sky-400';
        } else {
          document.documentElement.classList.remove('dark');
          document.getElementById('icon-theme').className = 'fa-solid fa-sun text-sm text-amber-500';
        }
      }

      applyRandomPalette() {
        const randomIndex = Math.floor(Math.random() * COLOR_PALETTES.length);
        this.currentPalette = COLOR_PALETTES[randomIndex];

        const root = document.documentElement;
        root.style.setProperty('--theme-from', this.currentPalette.from);
        root.style.setProperty('--theme-to', this.currentPalette.to);
        root.style.setProperty('--theme-border', this.currentPalette.border);
        root.style.setProperty('--theme-glow', this.currentPalette.glow);
        root.style.setProperty('--theme-ghost', this.currentPalette.ghost);

        const badge = document.getElementById('theme-color-indicator');
        const badgeName = document.getElementById('theme-color-name');
        if (badge) badge.style.backgroundColor = this.currentPalette.to;
        if (badgeName) badgeName.textContent = this.currentPalette.name;
      }

      initDOM() {
        const grid = document.getElementById('board-grid');
        grid.innerHTML = '';

        for (let y = 0; y < 9; y++) {
          for (let x = 0; x < 9; x++) {
            const cell = document.createElement('div');
            cell.className = 'grid-cell';
            cell.dataset.x = x;
            cell.dataset.y = y;

            // 스도쿠 3x3 섹터 체커보드 음영
            const secX = Math.floor(x / 3);
            const secY = Math.floor(y / 3);
            if ((secX + secY) % 2 === 1) {
              cell.classList.add('tint-zone');
            }

            // 3x3 경계선 굵게
            if (x === 2 || x === 5) cell.classList.add('sector-border-r');
            if (y === 2 || y === 5) cell.classList.add('sector-border-b');

            grid.appendChild(cell);
          }
        }

        document.getElementById('best-score').textContent = this.bestScore.toLocaleString();
      }

      startNewGame() {
        this.board = Array(9).fill(null).map(() => Array(9).fill(0));
        this.score = 0;
        this.streak = 0;
        this.isGameOver = false;

        // 매 게임마다 새로운 블록 컬러 테마 적용!
        this.applyRandomPalette();

        this.renderBoard();
        this.spawnTray();
        this.updateScoreView();
        this.hideCaution();
        this.saveSession();

        const modal = document.getElementById('game-over-modal');
        modal.classList.add('hidden');
        modal.classList.remove('opacity-100');
      }

      saveSession() {
        if (this.isGameOver) {
          localStorage.removeItem('blockudoku_state');
          return;
        }
        const state = {
          board: this.board,
          tray: this.tray,
          score: this.score,
          streak: this.streak,
          paletteName: this.currentPalette.name
        };
        localStorage.setItem('blockudoku_state', JSON.stringify(state));
        localStorage.setItem('blockudoku_best', this.bestScore.toString());
      }

      loadSession() {
        const raw = localStorage.getItem('blockudoku_state');
        if (!raw) return false;
        try {
          const data = JSON.parse(raw);
          if (data && Array.isArray(data.board) && Array.isArray(data.tray)) {
            this.board = data.board;
            this.tray = data.tray;
            this.score = data.score || 0;
            this.streak = data.streak || 0;

            const matchedPalette = COLOR_PALETTES.find(p => p.name === data.paletteName) || COLOR_PALETTES[0];
            this.currentPalette = matchedPalette;
            const root = document.documentElement;
            root.style.setProperty('--theme-from', this.currentPalette.from);
            root.style.setProperty('--theme-to', this.currentPalette.to);
            root.style.setProperty('--theme-border', this.currentPalette.border);
            root.style.setProperty('--theme-glow', this.currentPalette.glow);
            root.style.setProperty('--theme-ghost', this.currentPalette.ghost);

            const badge = document.getElementById('theme-color-indicator');
            const badgeName = document.getElementById('theme-color-name');
            if (badge) badge.style.backgroundColor = this.currentPalette.to;
            if (badgeName) badgeName.textContent = this.currentPalette.name;

            this.renderBoard();
            this.renderTray();
            this.updateScoreView();
            this.checkAvailableMoves();
            return true;
          }
        } catch (e) {}
        return false;
      }

      /* 난이도 상향 가중치 블록 생성 알고리즘 */
      spawnTray() {
        const newTray = [];
        const tier1 = BLOCK_SHAPES.filter(s => s.tier === 1);
        const tier2 = BLOCK_SHAPES.filter(s => s.tier === 2);
        const tier3 = BLOCK_SHAPES.filter(s => s.tier === 3);

        // 점수에 따라 고난도(Tier 2, 3) 출현 비중 증가
        let t1Weight = 0.35;
        let t2Weight = 0.40;
        let t3Weight = 0.25;

        if (this.score >= 500) {
          t1Weight = 0.20;
          t2Weight = 0.45;
          t3Weight = 0.35;
        }
        if (this.score >= 1200) {
          t1Weight = 0.15;
          t2Weight = 0.45;
          t3Weight = 0.40;
        }

        for (let i = 0; i < 3; i++) {
          const rand = Math.random();
          let pool;
          if (rand < t1Weight) {
            pool = tier1;
          } else if (rand < t1Weight + t2Weight) {
            pool = tier2;
          } else {
            pool = tier3;
          }
          const picked = pool[Math.floor(Math.random() * pool.length)];
          newTray.push(picked);
        }

        this.tray = newTray;
        this.renderTray();
        this.checkAvailableMoves();
      }

      renderBoard() {
        for (let y = 0; y < 9; y++) {
          for (let x = 0; x < 9; x++) {
            const cellEl = document.querySelector(`.grid-cell[data-x="${x}"][data-y="${y}"]`);
            if (cellEl) {
              if (this.board[y][x] === 1) {
                cellEl.classList.add('occupied');
              } else {
                cellEl.classList.remove('occupied');
              }
            }
          }
        }
      }

      renderTray() {
        for (let i = 0; i < 3; i++) {
          this.renderTraySlot(i);
        }
      }

      renderTraySlot(index) {
        const slotEl = document.getElementById(`slot-${index}`);
        if (!slotEl) return;
        slotEl.innerHTML = '';
        slotEl.style.opacity = '1';

        const shape = this.tray[index];
        if (!shape) {
          slotEl.classList.add('disabled');
          return;
        }

        const matrix = shape.matrix;
        const rows = matrix.length;
        const cols = matrix[0].length;

        const blockContainer = document.createElement('div');
        blockContainer.className = 'grid gap-[2.5px] pointer-events-none transition-transform duration-150';
        blockContainer.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;

        // 실제 게임과 비례하는 시원하고 선명한 크기
        const tileSize = 22;
        blockContainer.style.width = `${cols * tileSize + (cols - 1) * 2.5}px`;
        blockContainer.style.height = `${rows * tileSize + (rows - 1) * 2.5}px`;

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const tile = document.createElement('div');
            if (matrix[r][c] === 1) {
              tile.className = 'block-tile w-full h-full';
            } else {
              tile.className = 'w-full h-full opacity-0';
            }
            blockContainer.appendChild(tile);
          }
        }

        slotEl.appendChild(blockContainer);
      }

      canPlaceAt(matrix, startX, startY) {
        const h = matrix.length;
        const w = matrix[0].length;
        if (startX < 0 || startX + w > 9 || startY < 0 || startY + h > 9) return false;

        for (let r = 0; r < h; r++) {
          for (let c = 0; c < w; c++) {
            if (matrix[r][c] === 1) {
              if (this.board[startY + r][startX + c] === 1) return false;
            }
          }
        }
        return true;
      }

      canPlaceSomewhere(shape) {
        if (!shape || !shape.matrix) return false;
        const h = shape.matrix.length;
        const w = shape.matrix[0].length;
        for (let y = 0; y <= 9 - h; y++) {
          for (let x = 0; x <= 9 - w; x++) {
            if (this.canPlaceAt(shape.matrix, x, y)) return true;
          }
        }
        return false;
      }

      checkAvailableMoves() {
        let anyFits = false;
        let validCount = 0;
        let activeCount = 0;

        for (let i = 0; i < 3; i++) {
          const shape = this.tray[i];
          const slotEl = document.getElementById(`slot-${i}`);
          if (shape && slotEl) {
            activeCount++;
            const fits = this.canPlaceSomewhere(shape);
            if (fits) {
              slotEl.classList.remove('disabled');
              slotEl.style.opacity = '1';
              anyFits = true;
              validCount++;
            } else {
              slotEl.classList.add('disabled');
            }
          }
        }

        if (activeCount > 0 && !anyFits) {
          setTimeout(() => this.triggerGameOver(), 350);
          return;
        }

        // 보드 위기 감지 ("신중하게 움직이세요!")
        let occ = 0;
        for (let y = 0; y < 9; y++) {
          for (let x = 0; x < 9; x++) if (this.board[y][x] === 1) occ++;
        }
        const ratio = occ / 81;

        if ((ratio >= 0.70 || (activeCount >= 2 && validCount === 1)) && !this.isGameOver) {
          this.showCaution();
        } else if (ratio < 0.55) {
          this.hideCaution();
        }
      }

      showCaution() {
        const toast = document.getElementById('caution-toast');
        if (toast) {
          toast.classList.add('show');
          setTimeout(() => toast.classList.remove('show'), 2500);
        }
      }

      hideCaution() {
        const toast = document.getElementById('caution-toast');
        if (toast) toast.classList.remove('show');
      }

      placeBlock(slotIndex, startX, startY) {
        const shape = this.tray[slotIndex];
        if (!shape || !this.canPlaceAt(shape.matrix, startX, startY)) return false;

        const h = shape.matrix.length;
        const w = shape.matrix[0].length;
        let placedCount = 0;

        for (let r = 0; r < h; r++) {
          for (let c = 0; c < w; c++) {
            if (shape.matrix[r][c] === 1) {
              this.board[startY + r][startX + c] = 1;
              placedCount++;
            }
          }
        }

        this.addScore(placedCount);
        sound.playPlace();

        this.tray[slotIndex] = null;
        this.renderTraySlot(slotIndex);

        this.evaluateAndClear();

        if (this.tray.every(s => s === null)) {
          this.spawnTray();
        } else {
          this.checkAvailableMoves();
        }

        this.saveSession();
        return true;
      }

      evaluateAndClear() {
        const rows = [];
        const cols = [];
        const boxes = [];
        const targetCells = new Set();

        // 1. 행 검사
        for (let y = 0; y < 9; y++) {
          if (this.board[y].every(v => v === 1)) {
            rows.push(y);
            for (let x = 0; x < 9; x++) targetCells.add(`${x},${y}`);
          }
        }

        // 2. 열 검사
        for (let x = 0; x < 9; x++) {
          let full = true;
          for (let y = 0; y < 9; y++) {
            if (this.board[y][x] === 0) { full = false; break; }
          }
          if (full) {
            cols.push(x);
            for (let y = 0; y < 9; y++) targetCells.add(`${x},${y}`);
          }
        }

        // 3. 3x3 박스 검사
        for (let b = 0; b < 9; b++) {
          const sx = (b % 3) * 3;
          const sy = Math.floor(b / 3) * 3;
          let full = true;

          for (let dy = 0; dy < 3; dy++) {
            for (let dx = 0; dx < 3; dx++) {
              if (this.board[sy + dy][sx + dx] === 0) { full = false; break; }
            }
            if (!full) break;
          }

          if (full) {
            boxes.push(b);
            for (let dy = 0; dy < 3; dy++) {
              for (let dx = 0; dx < 3; dx++) targetCells.add(`${sx + dx},${sy + dy}`);
            }
          }
        }

        const totalUnits = rows.length + cols.length + boxes.length;

        if (totalUnits > 0) {
          this.streak++;

          // 콤보 점수 배점 상향 조정
          const baseUnit = 10;
          let comboMultiplier = 1.0;
          if (totalUnits === 2) comboMultiplier = 1.5; // 기존 1.3 -> 1.5 상향
          else if (totalUnits === 3) comboMultiplier = 2.0; // 기존 1.7 -> 2.0 상향
          else if (totalUnits >= 4) comboMultiplier = 2.5 + (totalUnits - 4) * 0.4; // 기존 2.0+ -> 2.5+ 상향

          let streakMultiplier = 1.0;
          if (this.streak === 2) streakMultiplier = 1.2;
          else if (this.streak === 3) streakMultiplier = 1.4;
          else if (this.streak >= 4) streakMultiplier = 1.6 + (this.streak - 4) * 0.1;

          const earned = Math.round(totalUnits * baseUnit * comboMultiplier * streakMultiplier);
          this.addScore(earned);

          sound.playClear(totalUnits);

          // 데이터 상에서는 즉시 0으로 비워 유효성 검사에서 빈 공간으로 즉시 인식되도록 처리
          targetCells.forEach(key => {
            const [x, y] = key.split(',').map(Number);
            this.board[y][x] = 0;
            const cellEl = document.querySelector(`.grid-cell[data-x="${x}"][data-y="${y}"]`);
            if (cellEl) {
              cellEl.classList.add('clearing');
            }
          });

          // 애니메이션 종료 후 DOM 클래스 정리 및 사용 가능 수 재확인
          setTimeout(() => {
            targetCells.forEach(key => {
              const [x, y] = key.split(',').map(Number);
              const cellEl = document.querySelector(`.grid-cell[data-x="${x}"][data-y="${y}"]`);
              if (cellEl) {
                cellEl.classList.remove('clearing', 'occupied');
              }
            });
            this.checkAvailableMoves();
            this.saveSession();
          }, 280);

          this.showFloatingScore(`+${earned}`);

          // 올 클리어 체크
          setTimeout(() => {
            const allEmpty = this.board.every(r => r.every(v => v === 0));
            if (allEmpty) {
              this.triggerAllClear();
            }
          }, 300);
        } else {
          this.streak = 0;
        }

        this.renderBoard();
      }

      triggerAllClear() {
        this.addScore(100);
        sound.playAllClear();

        // 현재 블록 테마 색상으로 물결치는 파도타기
        for (let y = 0; y < 9; y++) {
          for (let x = 0; x < 9; x++) {
            const cellEl = document.querySelector(`.grid-cell[data-x="${x}"][data-y="${y}"]`);
            if (cellEl) {
              setTimeout(() => {
                cellEl.classList.add('wave-tile');
                setTimeout(() => cellEl.classList.remove('wave-tile'), 550);
              }, y * 50 + (x % 3) * 12);
            }
          }
        }

        // 깔끔한 ALL CLEAR +100 배너
        const feedback = document.getElementById('feedback-layer');
        const banner = document.createElement('div');
        banner.className = 'all-clear-banner';
        banner.innerHTML = `
          <div class="flex items-center gap-2 mb-1">
            <i class="fa-solid fa-star text-amber-400 text-sm animate-spin"></i>
            <span class="text-2xl font-black text-amber-400 tracking-wider">ALL CLEAR!</span>
            <i class="fa-solid fa-star text-amber-400 text-sm animate-spin"></i>
          </div>
          <div class="text-xl font-black text-sky-400">+100 BONUS</div>
        `;
        feedback.appendChild(banner);
        setTimeout(() => banner.remove(), 2200);
      }

      showFloatingScore(text, isDanger = false) {
        const feedback = document.getElementById('feedback-layer');
        const pop = document.createElement('div');
        pop.className = 'score-popup text-xl';
        pop.style.left = '50%';
        pop.style.top = '45%';
        pop.style.color = isDanger ? '#f43f5e' : this.currentPalette.to;
        pop.textContent = text;
        feedback.appendChild(pop);
        setTimeout(() => pop.remove(), 850);
      }

      addScore(pts) {
        this.score += pts;
        if (this.score > this.bestScore) {
          this.bestScore = this.score;
          document.getElementById('best-score').textContent = this.bestScore.toLocaleString();
        }
        this.updateScoreView();
      }

      updateScoreView() {
        document.getElementById('score-display').textContent = this.score.toLocaleString();
      }

      triggerGameOver() {
        this.isGameOver = true;
        this.hideCaution();
        sound.playGameOver();

        document.getElementById('modal-score').textContent = this.score.toLocaleString();

        const modal = document.getElementById('game-over-modal');
        modal.classList.remove('hidden');
        setTimeout(() => {
          modal.classList.add('opacity-100');
          document.getElementById('modal-card').classList.remove('scale-95');
        }, 15);
      }

      bindEvents() {
        // 사운드 토글
        document.getElementById('btn-sound').addEventListener('click', () => {
          sound.enabled = !sound.enabled;
          document.getElementById('icon-sound').className = sound.enabled
            ? 'fa-solid fa-volume-high text-sm'
            : 'fa-solid fa-volume-xmark text-sm text-slate-400';
        });

        // 다크 / 라이트 모드 토글
        document.getElementById('btn-theme').addEventListener('click', () => {
          const isDark = document.documentElement.classList.toggle('dark');
          localStorage.setItem('blockudoku_theme_mode', isDark ? 'dark' : 'light');
          document.getElementById('icon-theme').className = isDark
            ? 'fa-solid fa-moon text-sm text-sky-400'
            : 'fa-solid fa-sun text-sm text-amber-500';
        });

        // 새 게임 리셋
        document.getElementById('btn-restart').addEventListener('click', () => {
          if (confirm('새 판을 시작하시겠습니까? (새로운 블록 테마가 적용됩니다)')) {
            this.startNewGame();
          }
        });

        // 게임 오버 모달 버튼 (새 게임 단독)
        document.getElementById('btn-newgame').addEventListener('click', () => this.startNewGame());

        // 터치 & 마우스 드래그 핸들링
        const trayFooter = document.querySelector('footer');
        trayFooter.addEventListener('pointerdown', (e) => this.onDragStart(e));
        window.addEventListener('pointermove', (e) => this.onDragMove(e), { passive: false });
        window.addEventListener('pointerup', (e) => this.onDragEnd(e));
        window.addEventListener('pointercancel', (e) => this.onDragEnd(e));
      }

      onDragStart(e) {
        if (this.isGameOver) return;
        sound.init();

        const slotEl = e.target.closest('.tray-slot');
        if (!slotEl || slotEl.classList.contains('disabled')) return;

        const slotIndex = parseInt(slotEl.dataset.slot, 10);
        const shape = this.tray[slotIndex];
        if (!shape) return;

        this.dragSlotIndex = slotIndex;
        this.dragShape = shape;

        sound.playGrab();

        // 보드 셀 크기에 맞춘 드래그 프록시 생성
        const boardEl = document.getElementById('board-grid');
        const boardCellSize = boardEl.clientWidth / 9;
        this.prepareDragProxy(shape, boardCellSize);

        slotEl.style.opacity = '0.15';
        this.updateDragProxyPos(e.clientX, e.clientY);

        e.preventDefault();
      }

      prepareDragProxy(shape, cellSize) {
        const proxy = document.getElementById('drag-proxy');
        const h = shape.matrix.length;
        const w = shape.matrix[0].length;
        const gap = 2;

        proxy.innerHTML = '';
        proxy.style.display = 'grid';
        proxy.style.gridTemplateColumns = `repeat(${w}, 1fr)`;
        proxy.style.gap = `${gap}px`;

        const totalW = w * cellSize + (w - 1) * gap;
        const totalH = h * cellSize + (h - 1) * gap;
        proxy.style.width = `${totalW}px`;
        proxy.style.height = `${totalH}px`;

        for (let r = 0; r < h; r++) {
          for (let c = 0; c < w; c++) {
            const cell = document.createElement('div');
            if (shape.matrix[r][c] === 1) {
              cell.className = 'block-tile w-full h-full';
            } else {
              cell.className = 'w-full h-full opacity-0';
            }
            proxy.appendChild(cell);
          }
        }
      }

      updateDragProxyPos(clientX, clientY) {
        const proxy = document.getElementById('drag-proxy');
        const w = parseFloat(proxy.style.width);
        const h = parseFloat(proxy.style.height);
        proxy.style.left = `${clientX - w / 2}px`;
        proxy.style.top = `${clientY - this.touchOffsetY - h / 2}px`;
      }

      onDragMove(e) {
        if (this.dragSlotIndex === null) return;
        e.preventDefault();
        this.updateDragProxyPos(e.clientX, e.clientY);
        this.updatePreview(e.clientX, e.clientY - this.touchOffsetY);
      }

      updatePreview(clientX, clientY) {
        this.clearPreview();
        const grid = document.getElementById('board-grid');
        const rect = grid.getBoundingClientRect();

        if (
          clientX < rect.left || clientX > rect.right ||
          clientY < rect.top || clientY > rect.bottom
        ) {
          this.hoverCoords = null;
          return;
        }

        const cellW = rect.width / 9;
        const cellH = rect.height / 9;
        const shape = this.dragShape;
        const sw = shape.matrix[0].length;
        const sh = shape.matrix.length;

        const relX = clientX - rect.left;
        const relY = clientY - rect.top;

        const gx = Math.round((relX - (sw * cellW) / 2) / cellW);
        const gy = Math.round((relY - (sh * cellH) / 2) / cellH);

        if (this.canPlaceAt(shape.matrix, gx, gy)) {
          this.hoverCoords = { x: gx, y: gy };

          // 고스트 프리뷰 표시
          for (let r = 0; r < sh; r++) {
            for (let c = 0; c < sw; c++) {
              if (shape.matrix[r][c] === 1) {
                const cell = document.querySelector(`.grid-cell[data-x="${gx + c}"][data-y="${gy + r}"]`);
                if (cell) cell.classList.add('ghost-hover');
              }
            }
          }

          // 라인 완성 사전 예측(Anticipation) 표시
          this.highlightAnticipation(shape.matrix, gx, gy);
        } else {
          this.hoverCoords = null;
        }
      }

      highlightAnticipation(matrix, sx, sy) {
        const sim = this.board.map(r => [...r]);
        const h = matrix.length;
        const w = matrix[0].length;

        for (let r = 0; r < h; r++) {
          for (let c = 0; c < w; c++) {
            if (matrix[r][c] === 1) sim[sy + r][sx + c] = 1;
          }
        }

        const willClear = new Set();

        for (let y = 0; y < 9; y++) {
          if (sim[y].every(v => v === 1)) {
            for (let x = 0; x < 9; x++) willClear.add(`${x},${y}`);
          }
        }

        for (let x = 0; x < 9; x++) {
          if (sim.every(r => r[x] === 1)) {
            for (let y = 0; y < 9; y++) willClear.add(`${x},${y}`);
          }
        }

        for (let b = 0; b < 9; b++) {
          const bx = (b % 3) * 3;
          const by = Math.floor(b / 3) * 3;
          let full = true;
          for (let dy = 0; dy < 3; dy++) {
            for (let dx = 0; dx < 3; dx++) {
              if (sim[by + dy][bx + dx] === 0) { full = false; break; }
            }
            if (!full) break;
          }
          if (full) {
            for (let dy = 0; dy < 3; dy++) {
              for (let dx = 0; dx < 3; dx++) willClear.add(`${bx + dx},${by + dy}`);
            }
          }
        }

        willClear.forEach(key => {
          const [x, y] = key.split(',').map(Number);
          const cell = document.querySelector(`.grid-cell[data-x="${x}"][data-y="${y}"]`);
          if (cell) cell.classList.add('anticipate-clear');
        });
      }

      clearPreview() {
        document.querySelectorAll('.grid-cell.ghost-hover').forEach(el => el.classList.remove('ghost-hover'));
        document.querySelectorAll('.grid-cell.anticipate-clear').forEach(el => el.classList.remove('anticipate-clear'));
      }

      onDragEnd() {
        if (this.dragSlotIndex === null) return;

        const proxy = document.getElementById('drag-proxy');
        proxy.style.display = 'none';
        this.clearPreview();

        const slotEl = document.getElementById(`slot-${this.dragSlotIndex}`);
        if (slotEl) {
          slotEl.style.opacity = '1';
        }

        if (this.hoverCoords) {
          const ok = this.placeBlock(this.dragSlotIndex, this.hoverCoords.x, this.hoverCoords.y);
          if (!ok && slotEl) slotEl.style.opacity = '1';
        } else {
          if (slotEl) slotEl.style.opacity = '1';
        }

        this.dragSlotIndex = null;
        this.dragShape = null;
        this.hoverCoords = null;
      }
    }

    // 인스턴스 전역 생성
    window.addEventListener('DOMContentLoaded', () => {
      window.gameInstance = new Blockudoku();
    });
  </script>
</body>
</html>
