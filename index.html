<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Blockudoku</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"Segoe UI"', 'Roboto', 'sans-serif'],
          }
        }
      }
    };
  </script>
  <style>
    * {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      box-sizing: border-box;
    }

    :root {
      --bg-main: #f5f6f8;
      --board-border: #cfd7e3;
      --board-inner-line: #dde3ea;
      --board-sector-line: #b6c3d4;
      --cell-white: #ffffff;
      --cell-tint: #edf1f7;
      --text-score: #1e293b;
      --text-sub: #94a3b8;

      /* 원본 특유의 세련된 프리미엄 블록 쉐이딩 변수 */
      --block-base: #4ca5db;
      --block-top: #5cbcf7;
      --block-bottom: #3b90c3;
      --block-border: rgba(30, 95, 138, 0.45);
      --block-shadow: rgba(43, 116, 161, 0.28);
      --theme-ghost: rgba(76, 165, 219, 0.35);
      --theme-glow: rgba(76, 165, 219, 0.6);
    }

    html.dark {
      --bg-main: #0c111c;
      --board-border: #232d3f;
      --board-inner-line: #1a2232;
      --board-sector-line: #2e3c54;
      --cell-white: #131a27;
      --cell-tint: #0f1520;
      --text-score: #f1f5f9;
      --text-sub: #64748b;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-score);
      transition: background-color 0.25s ease;
      overflow: hidden;
      touch-action: none;
    }

    .board-frame {
      background-color: var(--board-border);
      padding: 2.5px;
      border-radius: 10px;
      box-shadow: 0 6px 20px -4px rgba(0, 0, 0, 0.08);
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 370px;
      position: relative;
    }

    .board-table {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      grid-template-rows: repeat(9, 1fr);
      gap: 1.5px;
      background-color: var(--board-inner-line);
      border-radius: 8px;
      overflow: hidden;
    }

    .grid-cell {
      background-color: var(--cell-white);
      position: relative;
      transition: background-color 0.12s ease;
    }

    .grid-cell.tint-zone {
      background-color: var(--cell-tint);
    }

    .grid-cell.sector-border-r {
      border-right: 2px solid var(--board-sector-line) !important;
    }
    .grid-cell.sector-border-b {
      border-bottom: 2px solid var(--board-sector-line) !important;
    }

    .block-tile,
    .grid-cell.occupied {
      background: linear-gradient(180deg, var(--block-top) 0%, var(--block-base) 45%, var(--block-bottom) 100%) !important;
      border: 1px solid var(--block-border) !important;
      border-radius: 4px;
      box-shadow: 
        inset 0 1px 0 rgba(255, 255, 255, 0.65),
        inset 0 -1px 0 rgba(0, 0, 0, 0.15),
        0 1.5px 3px var(--block-shadow) !important;
      position: relative;
      z-index: 2;
    }

    .grid-cell.ghost-hover {
      background: var(--theme-ghost) !important;
      outline: 2px dashed var(--block-base);
      outline-offset: -2px;
      border-radius: 4px;
      z-index: 4;
    }

    .grid-cell.anticipate-clear {
      animation: pulse-anticipate 0.35s infinite alternate ease-in-out;
      background: linear-gradient(180deg, #fcd34d 0%, #f59e0b 60%, #d97706 100%) !important;
      border: 1px solid rgba(180, 83, 9, 0.6) !important;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.7);
      border-radius: 4px;
      z-index: 6;
    }

    @keyframes pulse-anticipate {
      0% { transform: scale(0.97); filter: brightness(1); }
      100% { transform: scale(1.02); filter: brightness(1.15); }
    }

    .grid-cell.clearing {
      animation: burst-clear 0.28s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      z-index: 10;
    }

    @keyframes burst-clear {
      0% { transform: scale(1); filter: brightness(1.6); }
      45% { transform: scale(1.12); opacity: 0.9; box-shadow: 0 0 16px var(--theme-glow); }
      100% { transform: scale(0.1); opacity: 0; }
    }

    .grid-cell.wave-tile {
      animation: wave-cascade 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      z-index: 12;
    }

    @keyframes wave-cascade {
      0% { transform: translateY(0); }
      35% {
        transform: translateY(-6px);
        background: linear-gradient(180deg, var(--block-top) 0%, var(--block-bottom) 100%) !important;
        box-shadow: 0 8px 16px var(--theme-glow);
        filter: brightness(1.2);
        border-radius: 4px;
      }
      100% { transform: translateY(0); }
    }

    .tray-wrapper {
      width: 100%;
      max-width: 370px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      align-items: center;
      justify-items: center;
      height: 110px;
      margin: 0 auto;
    }

    .tray-slot {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
      overflow: hidden;
      padding: 4px;
    }

    .tray-slot:active {
      cursor: grabbing;
    }

    .tray-slot.disabled {
      opacity: 0.22 !important;
      filter: grayscale(0.9);
      cursor: not-allowed;
      pointer-events: none;
    }

    #drag-proxy {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      display: none;
      filter: drop-shadow(0 14px 22px rgba(0, 0, 0, 0.28));
    }

    .caution-pill {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translate(-50%, -15px);
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
      color: #ffffff;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: -0.01em;
      box-shadow: 0 8px 18px rgba(234, 88, 12, 0.4);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .caution-pill.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .all-clear-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      opacity: 0;
      pointer-events: none;
      z-index: 70;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px 30px;
      border-radius: 20px;
      background: rgba(22, 28, 40, 0.94);
      border: 2px solid #f59e0b;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), 0 0 30px rgba(245, 158, 11, 0.4);
      color: #ffffff;
      animation: banner-pop 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes banner-pop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
      18% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
      28% { transform: translate(-50%, -50%) scale(1); }
      75% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -60%) scale(0.95); }
    }

    .score-popup {
      position: absolute;
      pointer-events: none;
      font-weight: 900;
      animation: float-score 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      z-index: 55;
    }

    @keyframes float-score {
      0% { opacity: 0; transform: translate(-50%, -30%) scale(0.7); }
      20% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
      100% { opacity: 0; transform: translate(-50%, -100%) scale(1); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between max-w-md mx-auto px-4 py-3 select-none">

  <div class="w-full flex items-center justify-between pt-1">
    <div class="flex items-center gap-2">
      <div id="theme-color-indicator" class="w-3.5 h-3.5 rounded-full shadow-inner border border-white/60"></div>
      <span id="theme-color-name" class="text-[11px] font-extrabold uppercase tracking-wider text-slate-400">Sky Blue</span>
    </div>
    <div class="flex items-center gap-3 text-slate-400">
      <button id="btn-sound" class="p-1 hover:text-slate-600 dark:hover:text-slate-200 transition" aria-label="사운드 토글">
        <i id="icon-sound" class="fa-solid fa-volume-high text-sm"></i>
      </button>
      <button id="btn-theme" class="p-1 hover:text-slate-600 dark:hover:text-slate-200 transition" aria-label="다크 모드 토글">
        <i id="icon-theme" class="fa-solid fa-sun text-sm text-amber-500"></i>
      </button>
      <button id="btn-restart" class="p-1 hover:text-slate-600 dark:hover:text-slate-200 transition" aria-label="새 판 시작">
        <i class="fa-solid fa-rotate-right text-sm"></i>
      </button>
    </div>
  </div>

  <header class="w-full flex flex-col items-center mt-1 mb-2">
    <div id="score-display" class="text-6xl font-light tracking-tight tabular-nums py-1 leading-none text-slate-800 dark:text-slate-100">
      0
    </div>

    <div class="w-full flex items-center justify-between px-2 mt-1">
      <div class="flex flex-col items-start">
        <span class="text-xs font-semibold text-slate-400">목표</span>
        <div class="flex items-center gap-1.5 text-slate-700 dark:text-slate-300 font-bold text-sm">
          <i class="fa-solid fa-circle-check text-sky-500 text-xs"></i>
          <span id="target-score">1000</span>
        </div>
      </div>
      <div class="flex flex-col items-end">
        <span class="text-xs font-semibold text-slate-400">최고 기록</span>
        <div class="flex items-center gap-1.5 text-slate-700 dark:text-slate-300 font-bold text-sm">
          <i class="fa-solid fa-trophy text-amber-500 text-xs"></i>
          <span id="best-score">0</span>
        </div>
      </div>
    </div>
  </header>

  <main class="w-full flex items-center justify-center my-auto relative">
    <div id="board-container" class="board-frame">
      <div id="board-grid" class="board-table">
        <!-- 81개 스도쿠 셀 -->
      </div>
      <div id="caution-toast" class="caution-pill">
        <i class="fa-solid fa-triangle-exclamation mr-1 text-xs"></i>
        <span>신중하게 움직이세요!</span>
      </div>
      <div id="feedback-layer" class="absolute inset-0 pointer-events-none overflow-hidden"></div>
    </div>
  </main>

  <footer class="w-full flex justify-center pb-4">
    <div class="tray-wrapper">
      <div class="tray-slot" id="slot-0" data-slot="0"></div>
      <div class="tray-slot" id="slot-1" data-slot="1"></div>
      <div class="tray-slot" id="slot-2" data-slot="2"></div>
    </div>
  </footer>

  <div id="drag-proxy"></div>

  <!-- 게임 오버 모달 -->
  <div id="game-over-modal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-200">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 w-full max-w-xs text-center shadow-2xl scale-95 transform transition-transform duration-200" id="modal-card">
      <div class="w-14 h-14 rounded-2xl bg-rose-500/10 text-rose-500 mx-auto flex items-center justify-center text-2xl mb-3">
        <i class="fa-solid fa-shapes"></i>
      </div>
      <h3 class="text-xl font-black mb-1">게임 오버</h3>
      <p class="text-xs text-slate-500 dark:text-slate-400 mb-4">더 이상 배치할 수 있는 자리가 없습니다!</p>

      <div class="bg-slate-100 dark:bg-slate-800/60 rounded-2xl p-3.5 mb-4">
        <span class="text-xs font-semibold text-slate-400">최종 점수</span>
        <div id="modal-score" class="text-3xl font-black mt-0.5">0</div>
      </div>

      <div class="flex flex-col gap-2">
        <button id="btn-newgame" class="w-full py-3 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white font-extrabold rounded-xl text-sm shadow-md active:scale-95 transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-rotate-right"></i>
          <span>새 게임 시작</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const COLOR_PALETTES = [
      { name: 'Sky Blue', base: '#4ca5db', top: '#5cbcf7', bottom: '#3b90c3', border: 'rgba(30, 95, 138, 0.45)', shadow: 'rgba(43, 116, 161, 0.3)', ghost: 'rgba(76, 165, 219, 0.35)', glow: 'rgba(76, 165, 219, 0.65)' },
      { name: 'Emerald Teal', base: '#27b587', top: '#3cd4a2', bottom: '#1c946d', border: 'rgba(18, 107, 78, 0.45)', shadow: 'rgba(28, 148, 109, 0.3)', ghost: 'rgba(39, 181, 135, 0.35)', glow: 'rgba(39, 181, 135, 0.65)' },
      { name: 'Sunset Coral', base: '#fa7a48', top: '#ff9266', bottom: '#dc5e2c', border: 'rgba(168, 57, 13, 0.45)', shadow: 'rgba(220, 94, 44, 0.3)', ghost: 'rgba(250, 122, 72, 0.35)', glow: 'rgba(250, 122, 72, 0.65)' },
      { name: 'Royal Violet', base: '#8c68ec', top: '#a183fa', bottom: '#734ed1', border: 'rgba(84, 49, 171, 0.45)', shadow: 'rgba(115, 78, 209, 0.3)', ghost: 'rgba(140, 104, 236, 0.35)', glow: 'rgba(140, 104, 236, 0.65)' },
      { name: 'Berry Magenta', base: '#e3518a', top: '#f76ca2', bottom: '#c2376f', border: 'rgba(148, 30, 77, 0.45)', shadow: 'rgba(194, 55, 111, 0.3)', ghost: 'rgba(227, 81, 138, 0.35)', glow: 'rgba(227, 81, 138, 0.65)' },
      { name: 'Deep Cyan', base: '#19abbf', top: '#34c7dc', bottom: '#0e8899', border: 'rgba(9, 101, 115, 0.45)', shadow: 'rgba(14, 136, 153, 0.3)', ghost: 'rgba(25, 171, 191, 0.35)', glow: 'rgba(25, 171, 191, 0.65)' }
    ];

    class SoundEngine {
      constructor() { this.ctx = null; this.enabled = true; }
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      playTone(freq, type = 'sine', duration = 0.1, gainVal = 0.14) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }
      playPlace() { this.playTone(320, 'triangle', 0.08, 0.16); }
      playGrab() { this.playTone(460, 'sine', 0.04, 0.08); }
      playClear(count = 1) {
        const notes = [392, 440, 523.25, 587.33, 659.25, 783.99];
        for (let i = 0; i < Math.min(count, notes.length); i++) {
          setTimeout(() => this.playTone(notes[i], 'triangle', 0.18, 0.18), i * 50);
        }
      }
      playAllClear() {
        [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50].forEach((p, i) => {
          setTimeout(() => this.playTone(p, 'sine', 0.26, 0.18), i * 65);
        });
      }
      playGameOver() {
        this.playTone(280, 'sawtooth', 0.2, 0.15);
        setTimeout(() => this.playTone(210, 'sawtooth', 0.25, 0.15), 130);
        setTimeout(() => this.playTone(150, 'sawtooth', 0.35, 0.18), 260);
      }
    }
    const sound = new SoundEngine();

    const BLOCK_SHAPES = [
      { id: '1x1', tier: 1, matrix: [[1]] },
      { id: '1x2', tier: 1, matrix: [[1, 1]] },
      { id: '2x1', tier: 1, matrix: [[1], [1]] },
      { id: '1x3', tier: 1, matrix: [[1, 1, 1]] },
      { id: '3x1', tier: 1, matrix: [[1], [1], [1]] },
      { id: 'L-2-1', tier: 1, matrix: [[1, 0], [1, 1]] },
      { id: 'L-2-2', tier: 1, matrix: [[0, 1], [1, 1]] },
      { id: 'L-2-3', tier: 1, matrix: [[1, 1], [1, 0]] },
      { id: 'L-2-4', tier: 1, matrix: [[1, 1], [0, 1]] },
      { id: '1x4', tier: 2, matrix: [[1, 1, 1, 1]] },
      { id: '4x1', tier: 2, matrix: [[1], [1], [1], [1]] },
      { id: '2x2', tier: 2, matrix: [[1, 1], [1, 1]] },
      { id: 'T-4-1', tier: 2, matrix: [[1, 1, 1], [0, 1, 0]] },
      { id: 'T-4-2', tier: 2, matrix: [[0, 1, 0], [1, 1, 1]] },
      { id: 'T-4-3', tier: 2, matrix: [[1, 0], [1, 1], [1, 0]] },
      { id: 'T-4-4', tier: 2, matrix: [[0, 1], [1, 1], [0, 1]] },
      { id: 'Z-4-1', tier: 2, matrix: [[1, 1, 0], [0, 1, 1]] },
      { id: 'S-4-1', tier: 2, matrix: [[0, 1, 1], [1, 1, 0]] },
      { id: '1x5', tier: 3, matrix: [[1, 1, 1, 1, 1]] },
      { id: '5x1', tier: 3, matrix: [[1], [1], [1], [1], [1]] },
      { id: 'L-3-1', tier: 3, matrix: [[1, 0, 0], [1, 0, 0], [1, 1, 1]] },
      { id: 'L-3-2', tier: 3, matrix: [[0, 0, 1], [0, 0, 1], [1, 1, 1]] },
      { id: 'L-3-3', tier: 3, matrix: [[1, 1, 1], [1, 0, 0], [1, 0, 0]] },
      { id: 'L-3-4', tier: 3, matrix: [[1, 1, 1], [0, 0, 1], [0, 0, 1]] }
    ];

    class Blockudoku {
      constructor() {
        this.board = Array(9).fill(null).map(() => Array(9).fill(0));
        this.tray = [null, null, null];
        this.score = 0;
        this.bestScore = parseInt(localStorage.getItem('blockudoku_best') || '0', 10);
        this.streak = 0;
        this.isGameOver = false;
        this.currentPalette = COLOR_PALETTES[0];

        this.dragSlotIndex = null;
        this.dragShape = null;
        this.hoverCoords = null;
        this.touchOffsetY = 75;

        this.initThemeMode();
        this.initDOM();
        this.bindEvents();

        if (!this.loadSession()) {
          this.startNewGame();
        }
      }

      initThemeMode() {
        const saved = localStorage.getItem('blockudoku_theme_mode');
        if (saved === 'dark') {
          document.documentElement.classList.add('dark');
          document.getElementById('icon-theme').className = 'fa-solid fa-moon text-sm text-sky-400';
        } else {
          document.documentElement.classList.remove('dark');
          document.getElementById('icon-theme').className = 'fa-solid fa-sun text-sm text-amber-500';
        }
      }

      applyRandomPalette() {
        this.currentPalette = COLOR_PALETTES[Math.floor(Math.random() * COLOR_PALETTES.length)];
        this.updateCSSVariables();
      }

      updateCSSVariables() {
        const root = document.documentElement;
        root.style.setProperty('--block-base', this.currentPalette.base);
        root.style.setProperty('--block-top', this.currentPalette.top);
        root.style.setProperty('--block-bottom', this.currentPalette.bottom);
        root.style.setProperty('--block-border', this.currentPalette.border);
        root.style.setProperty('--block-shadow', this.currentPalette.shadow);
        root.style.setProperty('--theme-ghost', this.currentPalette.ghost);
        root.style.setProperty('--theme-glow', this.currentPalette.glow);

        const badge = document.getElementById('theme-color-indicator');
        const badgeName = document.getElementById('theme-color-name');
        if (badge) badge.style.backgroundColor = this.currentPalette.base;
        if (badgeName) badgeName.textContent = this.currentPalette.name;
      }

      initDOM() {
        const grid = document.getElementById('board-grid');
        grid.innerHTML = '';
        for (let y = 0; y < 9; y++) {
          for (let x = 0; x < 9; x++) {
            const cell = document.createElement('div');
            cell.className = 'grid-cell';
            cell.dataset.x = x;
            cell.dataset.y = y;
            if ((Math.floor(x / 3) + Math.floor(y / 3)) % 2 === 1) cell.classList.add('tint-zone');
            if (x === 2 || x === 5) cell.classList.add('sector-border-r');
            if (y === 2 || y === 5) cell.classList.add('sector-border-b');
            grid.appendChild(cell);
          }
        }
        document.getElementById('best-score').textContent = this.bestScore.toLocaleString();
      }

      startNewGame() {
        this.board = Array(9).fill(null).map(() => Array(9).fill(0));
        this.score = 0;
        this.streak = 0;
        this.isGameOver = false;

        this.applyRandomPalette();
        this.renderBoard();
        this.spawnTray();
        this.updateScoreView();
        this.hideCaution();
        this.saveSession();

        const modal = document.getElementById('game-over-modal');
        modal.classList.add('hidden');
        modal.classList.remove('opacity-100');
      }

      saveSession() {
        if (this.isGameOver) {
          localStorage.removeItem('blockudoku_state');
          return;
        }
        localStorage.setItem('blockudoku_state', JSON.stringify({
          board: this.board, tray: this.tray, score: this.score, streak: this.streak, paletteName: this.currentPalette.name
        }));
        localStorage.setItem('blockudoku_best', this.bestScore.toString());
      }

      loadSession() {
        const raw = localStorage.getItem('blockudoku_state');
        if (!raw) return false;
        try {
          const data = JSON.parse(raw);
          if (data && Array.isArray(data.board) && Array.isArray(data.tray)) {
            this.board = data.board;
            this.tray = data.tray;
            this.score = data.score || 0;
            this.streak = data.streak || 0;
            this.currentPalette = COLOR_PALETTES.find(p => p.name === data.paletteName) || COLOR_PALETTES[0];
            this.updateCSSVariables();
            this.renderBoard();
            this.renderTray();
            this.updateScoreView();
            this.checkAvailableMoves();
            return true;
          }
        } catch (e) {}
        return false;
      }

      spawnTray() {
        const tier1 = BLOCK_SHAPES.filter(s => s.tier === 1);
        const tier2 = BLOCK_SHAPES.filter(s => s.tier === 2);
        const tier3 = BLOCK_SHAPES.filter(s => s.tier === 3);

        let occupiedCount = 0;
        for (let y = 0; y < 9; y++) {
          for (let x = 0; x < 9; x++) if (this.board[y][x] === 1) occupiedCount++;
        }
        const occRatio = occupiedCount / 81;

        let t1W = 0.35, t2W = 0.45, t3W = 0.20;
        if (this.score >= 500) { t1W = 0.25; t2W = 0.45; t3W = 0.30; }
        if (this.score >= 1200) { t1W = 0.20; t2W = 0.45; t3W = 0.35; }

        if (occRatio >= 0.65) { t1W = 0.65; t2W = 0.30; t3W = 0.05; }
        else if (occRatio >= 0.50) { t1W = Math.max(t1W, 0.40); t3W = Math.min(t3W, 0.20); }

        const newTray = [];
        let tier3Picked = 0;

        for (let i = 0; i < 3; i++) {
          const effT3 = tier3Picked >= 1 ? 0 : t3W;
          const tot = t1W + t2W + effT3;
          const rand = Math.random() * tot;
          let pool;
          if (rand < t1W) { pool = tier1; }
          else if (rand < t1W + t2W) { pool = tier2; }
          else { pool = tier3; tier3Picked++; }
          newTray.push(pool[Math.floor(Math.random() * pool.length)]);
        }

        // Guarantee Fit
        if (!newTray.some(s => this.canPlaceSomewhere(s))) {
          const fits = BLOCK_SHAPES.filter(s => this.canPlaceSomewhere(s));
          if (fits.length > 0) {
            const t1Fit = fits.filter(s => s.tier === 1);
            newTray[2] = (t1Fit.length > 0 ? t1Fit : fits)[Math.floor(Math.random() * (t1Fit.length > 0 ? t1Fit : fits).length)];
          }
        }

        this.tray = newTray;
        this.renderTray();
        this.checkAvailableMoves();
      }

      renderBoard() {
        for (let y = 0; y < 9; y++) {
          for (let x = 0; x < 9; x++) {
            const cellEl = document.querySelector(`.grid-cell[data-x="${x}"][data-y="${y}"]`);
            if (cellEl) {
              if (this.board[y][x] === 1) cellEl.classList.add('occupied');
              else cellEl.classList.remove('occupied');
            }
          }
        }
      }

      renderTray() {
        for (let i = 0; i < 3; i++) this.renderTraySlot(i);
      }

      renderTraySlot(index) {
        const slotEl = document.getElementById(`slot-${index}`);
        if (!slotEl) return;
        slotEl.innerHTML = '';
        slotEl.style.opacity = '1';

        const shape = this.tray[index];
        if (!shape) {
          slotEl.classList.add('disabled');
          return;
        }

        const matrix = shape.matrix;
        const rows = matrix.length;
        const cols = matrix[0].length;

        const container = document.createElement('div');
        container.className = 'grid pointer-events-none';
        container.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
        const gap = 1.5;
        container.style.gap = `${gap}px`;

        const tileSize = 24;
        container.style.width = `${cols * tileSize + (cols - 1) * gap}px`;
        container.style.height = `${rows * tileSize + (rows - 1) * gap}px`;

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const tile = document.createElement('div');
            tile.className = matrix[r][c] === 1 ? 'block-tile w-full h-full' : 'w-full h-full opacity-0 pointer-events-none';
            container.appendChild(tile);
          }
        }
        slotEl.appendChild(container);
      }

      canPlaceAt(matrix, startX, startY) {
        const h = matrix.length, w = matrix[0].length;
        if (startX < 0 || startX + w > 9 || startY < 0 || startY + h > 9) return false;
        for (let r = 0; r < h; r++) {
          for (let c = 0; c < w; c++) {
            if (matrix[r][c] === 1 && this.board[startY + r][startX + c] === 1) return false;
          }
        }
        return true;
      }

      canPlaceSomewhere(shape) {
        if (!shape || !shape.matrix) return false;
        const h = shape.matrix.length, w = shape.matrix[0].length;
        for (let y = 0; y <= 9 - h; y++) {
          for (let x = 0; x <= 9 - w; x++) {
            if (this.canPlaceAt(shape.matrix, x, y)) return true;
          }
        }
        return false;
      }

      checkAvailableMoves() {
        let anyFits = false, validCount = 0, activeCount = 0;
        for (let i = 0; i < 3; i++) {
          const shape = this.tray[i];
          const slotEl = document.getElementById(`slot-${i}`);
          if (shape && slotEl) {
            activeCount++;
            if (this.canPlaceSomewhere(shape)) {
              slotEl.classList.remove('disabled');
              slotEl.style.opacity = '1';
              anyFits = true;
              validCount++;
            } else {
              slotEl.classList.add('disabled');
            }
          }
        }

        if (activeCount > 0 && !anyFits) {
          setTimeout(() => this.triggerGameOver(), 350);
          return;
        }

        let occ = 0;
        for (let y = 0; y < 9; y++) for (let x = 0; x < 9; x++) if (this.board[y][x] === 1) occ++;
        const ratio = occ / 81;

        if ((ratio >= 0.70 || (activeCount >= 2 && validCount === 1)) && !this.isGameOver) {
          this.showCaution();
        } else if (ratio < 0.55) {
          this.hideCaution();
        }
      }

      showCaution() {
        const toast = document.getElementById('caution-toast');
        if (toast) { toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2500); }
      }
      hideCaution() {
        const toast = document.getElementById('caution-toast');
        if (toast) toast.classList.remove('show');
      }

      placeBlock(slotIndex, startX, startY) {
        const shape = this.tray[slotIndex];
        if (!shape || !this.canPlaceAt(shape.matrix, startX, startY)) return false;

        const h = shape.matrix.length, w = shape.matrix[0].length;
        let placedCount = 0;
        for (let r = 0; r < h; r++) {
          for (let c = 0; c < w; c++) {
            if (shape.matrix[r][c] === 1) {
              this.board[startY + r][startX + c] = 1;
              placedCount++;
            }
          }
        }

        this.addScore(placedCount);
        sound.playPlace();

        this.tray[slotIndex] = null;
        this.renderTraySlot(slotIndex);
        this.evaluateAndClear();

        if (this.tray.every(s => s === null)) {
          this.spawnTray();
        } else {
          this.checkAvailableMoves();
        }
        this.saveSession();
        return true;
      }

      evaluateAndClear() {
        const rows = [], cols = [], boxes = [], targetCells = new Set();

        for (let y = 0; y < 9; y++) {
          if (this.board[y].every(v => v === 1)) {
            rows.push(y);
            for (let x = 0; x < 9; x++) targetCells.add(`${x},${y}`);
          }
        }

        for (let x = 0; x < 9; x++) {
          let full = true;
          for (let y = 0; y < 9; y++) if (this.board[y][x] === 0) { full = false; break; }
          if (full) {
            cols.push(x);
            for (let y = 0; y < 9; y++) targetCells.add(`${x},${y}`);
          }
        }

        for (let b = 0; b < 9; b++) {
          const sx = (b % 3) * 3, sy = Math.floor(b / 3) * 3;
          let full = true;
          for (let dy = 0; dy < 3; dy++) {
            for (let dx = 0; dx < 3; dx++) if (this.board[sy + dy][sx + dx] === 0) { full = false; break; }
            if (!full) break;
          }
          if (full) {
            boxes.push(b);
            for (let dy = 0; dy < 3; dy++) for (let dx = 0; dx < 3; dx++) targetCells.add(`${sx + dx},${sy + dy}`);
          }
        }

        const totalUnits = rows.length + cols.length + boxes.length;
        if (totalUnits > 0) {
          this.streak++;
          const baseUnit = 10;
          let comboM = 1.0;
          if (totalUnits === 2) comboM = 1.5;
          else if (totalUnits === 3) comboM = 2.0;
          else if (totalUnits >= 4) comboM = 2.5 + (totalUnits - 4) * 0.4;

          let streakM = 1.0;
          if (this.streak === 2) streakM = 1.2;
          else if (this.streak === 3) streakM = 1.4;
          else if (this.streak >= 4) streakM = 1.6 + (this.streak - 4) * 0.1;

          const earned = Math.round(totalUnits * baseUnit * comboM * streakM);
          this.addScore(earned);
          sound.playClear(totalUnits);

          targetCells.forEach(key => {
            const [x, y] = key.split(',').map(Number);
            this.board[y][x] = 0;
            const cellEl = document.querySelector(`.grid-cell[data-x="${x}"][data-y="${y}"]`);
            if (cellEl) cellEl.classList.add('clearing');
          });

          setTimeout(() => {
            targetCells.forEach(key => {
              const [x, y] = key.split(',').map(Number);
              const cellEl = document.querySelector(`.grid-cell[data-x="${x}"][data-y="${y}"]`);
              if (cellEl) cellEl.classList.remove('clearing', 'occupied');
            });
            this.checkAvailableMoves();
            this.saveSession();
          }, 280);

          this.showFloatingScore(`+${earned}`);
          setTimeout(() => {
            if (this.board.every(r => r.every(v => v === 0))) this.triggerAllClear();
          }, 300);
        } else {
          this.streak = 0;
        }
        this.renderBoard();
      }

      triggerAllClear() {
        this.addScore(100);
        sound.playAllClear();
        for (let y = 0; y < 9; y++) {
          for (let x = 0; x < 9; x++) {
            const cellEl = document.querySelector(`.grid-cell[data-x="${x}"][data-y="${y}"]`);
            if (cellEl) {
              setTimeout(() => {
                cellEl.classList.add('wave-tile');
                setTimeout(() => cellEl.classList.remove('wave-tile'), 550);
              }, y * 50 + (x % 3) * 12);
            }
          }
        }
        const feedback = document.getElementById('feedback-layer');
        const banner = document.createElement('div');
        banner.className = 'all-clear-banner';
        banner.innerHTML = `
          <div class="flex items-center gap-2 mb-1">
            <i class="fa-solid fa-star text-amber-400 text-sm animate-spin"></i>
            <span class="text-2xl font-black text-amber-400 tracking-wider">ALL CLEAR!</span>
            <i class="fa-solid fa-star text-amber-400 text-sm animate-spin"></i>
          </div>
          <div class="text-xl font-black text-sky-400">+100 BONUS</div>
        `;
        feedback.appendChild(banner);
        setTimeout(() => banner.remove(), 2200);
      }

      showFloatingScore(text) {
        const feedback = document.getElementById('feedback-layer');
        const pop = document.createElement('div');
        pop.className = 'score-popup text-xl';
        pop.style.left = '50%'; pop.style.top = '45%';
        pop.style.color = this.currentPalette.base;
        pop.textContent = text;
        feedback.appendChild(pop);
        setTimeout(() => pop.remove(), 850);
      }

      addScore(pts) {
        this.score += pts;
        if (this.score > this.bestScore) {
          this.bestScore = this.score;
          document.getElementById('best-score').textContent = this.bestScore.toLocaleString();
        }
        this.updateScoreView();
      }

      updateScoreView() {
        document.getElementById('score-display').textContent = this.score.toLocaleString();
      }

      triggerGameOver() {
        this.isGameOver = true;
        this.hideCaution();
        sound.playGameOver();
        document.getElementById('modal-score').textContent = this.score.toLocaleString();
        const modal = document.getElementById('game-over-modal');
        modal.classList.remove('hidden');
        setTimeout(() => {
          modal.classList.add('opacity-100');
          document.getElementById('modal-card').classList.remove('scale-95');
        }, 15);
      }

      bindEvents() {
        document.getElementById('btn-sound').addEventListener('click', () => {
          sound.enabled = !sound.enabled;
          document.getElementById('icon-sound').className = sound.enabled ? 'fa-solid fa-volume-high text-sm' : 'fa-solid fa-volume-xmark text-sm text-slate-400';
        });

        document.getElementById('btn-theme').addEventListener('click', () => {
          const isDark = document.documentElement.classList.toggle('dark');
          localStorage.setItem('blockudoku_theme_mode', isDark ? 'dark' : 'light');
          document.getElementById('icon-theme').className = isDark ? 'fa-solid fa-moon text-sm text-sky-400' : 'fa-solid fa-sun text-sm text-amber-500';
        });

        document.getElementById('btn-restart').addEventListener('click', () => {
          if (confirm('새 판을 시작하시겠습니까? (새로운 블록 테마가 적용됩니다)')) this.startNewGame();
        });

        document.getElementById('btn-newgame').addEventListener('click', () => this.startNewGame());

        const trayFooter = document.querySelector('footer');
        trayFooter.addEventListener('pointerdown', (e) => this.onDragStart(e));
        window.addEventListener('pointermove', (e) => this.onDragMove(e), { passive: false });
        window.addEventListener('pointerup', (e) => this.onDragEnd(e));
        window.addEventListener('pointercancel', (e) => this.onDragEnd(e));
      }

      onDragStart(e) {
        if (this.isGameOver) return;
        sound.init();
        const slotEl = e.target.closest('.tray-slot');
        if (!slotEl || slotEl.classList.contains('disabled')) return;
        const slotIndex = parseInt(slotEl.dataset.slot, 10);
        const shape = this.tray[slotIndex];
        if (!shape) return;

        this.dragSlotIndex = slotIndex;
        this.dragShape = shape;
        sound.playGrab();

        const boardEl = document.getElementById('board-grid');
        this.prepareDragProxy(shape, boardEl.clientWidth / 9);

        slotEl.style.opacity = '0.15';
        this.updateDragProxyPos(e.clientX, e.clientY);
        e.preventDefault();
      }

      prepareDragProxy(shape, cellSize) {
        const proxy = document.getElementById('drag-proxy');
        const h = shape.matrix.length, w = shape.matrix[0].length, gap = 1.5;
        proxy.innerHTML = '';
        proxy.style.display = 'grid';
        proxy.style.gridTemplateColumns = `repeat(${w}, 1fr)`;
        proxy.style.gap = `${gap}px`;
        proxy.style.width = `${w * cellSize + (w - 1) * gap}px`;
        proxy.style.height = `${h * cellSize + (h - 1) * gap}px`;

        for (let r = 0; r < h; r++) {
          for (let c = 0; c < w; c++) {
            const cell = document.createElement('div');
            cell.className = shape.matrix[r][c] === 1 ? 'block-tile w-full h-full' : 'w-full h-full opacity-0 pointer-events-none';
            proxy.appendChild(cell);
          }
        }
      }

      updateDragProxyPos(clientX, clientY) {
        const proxy = document.getElementById('drag-proxy');
        proxy.style.left = `${clientX - parseFloat(proxy.style.width) / 2}px`;
        proxy.style.top = `${clientY - this.touchOffsetY - parseFloat(proxy.style.height) / 2}px`;
      }

      onDragMove(e) {
        if (this.dragSlotIndex === null) return;
        e.preventDefault();
        this.updateDragProxyPos(e.clientX, e.clientY);
        this.updatePreview(e.clientX, e.clientY - this.touchOffsetY);
      }

      updatePreview(clientX, clientY) {
        this.clearPreview();
        const grid = document.getElementById('board-grid');
        const rect = grid.getBoundingClientRect();
        if (clientX < rect.left || clientX > rect.right || clientY < rect.top || clientY > rect.bottom) {
          this.hoverCoords = null;
          return;
        }

        const cellW = rect.width / 9, cellH = rect.height / 9;
        const sw = this.dragShape.matrix[0].length, sh = this.dragShape.matrix.length;
        const gx = Math.round((clientX - rect.left - (sw * cellW) / 2) / cellW);
        const gy = Math.round((clientY - rect.top - (sh * cellH) / 2) / cellH);

        if (this.canPlaceAt(this.dragShape.matrix, gx, gy)) {
          this.hoverCoords = { x: gx, y: gy };
          for (let r = 0; r < sh; r++) {
            for (let c = 0; c < sw; c++) {
              if (this.dragShape.matrix[r][c] === 1) {
                const cell = document.querySelector(`.grid-cell[data-x="${gx + c}"][data-y="${gy + r}"]`);
                if (cell) cell.classList.add('ghost-hover');
              }
            }
          }
          this.highlightAnticipation(this.dragShape.matrix, gx, gy);
        } else {
          this.hoverCoords = null;
        }
      }

      highlightAnticipation(matrix, sx, sy) {
        const sim = this.board.map(r => [...r]);
        const h = matrix.length, w = matrix[0].length;
        for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) if (matrix[r][c] === 1) sim[sy + r][sx + c] = 1;

        const willClear = new Set();
        for (let y = 0; y < 9; y++) if (sim[y].every(v => v === 1)) for (let x = 0; x < 9; x++) willClear.add(`${x},${y}`);
        for (let x = 0; x < 9; x++) if (sim.every(r => r[x] === 1)) for (let y = 0; y < 9; y++) willClear.add(`${x},${y}`);
        for (let b = 0; b < 9; b++) {
          const bx = (b % 3) * 3, by = Math.floor(b / 3) * 3;
          let full = true;
          for (let dy = 0; dy < 3; dy++) {
            for (let dx = 0; dx < 3; dx++) if (sim[by + dy][bx + dx] === 0) { full = false; break; }
            if (!full) break;
          }
          if (full) for (let dy = 0; dy < 3; dy++) for (let dx = 0; dx < 3; dx++) willClear.add(`${bx + dx},${by + dy}`);
        }

        willClear.forEach(key => {
          const [x, y] = key.split(',').map(Number);
          const cell = document.querySelector(`.grid-cell[data-x="${x}"][data-y="${y}"]`);
          if (cell) cell.classList.add('anticipate-clear');
        });
      }

      clearPreview() {
        document.querySelectorAll('.grid-cell.ghost-hover').forEach(el => el.classList.remove('ghost-hover'));
        document.querySelectorAll('.grid-cell.anticipate-clear').forEach(el => el.classList.remove('anticipate-clear'));
      }

      onDragEnd() {
        if (this.dragSlotIndex === null) return;
        document.getElementById('drag-proxy').style.display = 'none';
        this.clearPreview();

        const slotEl = document.getElementById(`slot-${this.dragSlotIndex}`);
        if (slotEl) slotEl.style.opacity = '1';

        if (this.hoverCoords) {
          this.placeBlock(this.dragSlotIndex, this.hoverCoords.x, this.hoverCoords.y);
        }

        this.dragSlotIndex = null;
        this.dragShape = null;
        this.hoverCoords = null;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.gameInstance = new Blockudoku();
    });
  </script>
</body>
</html>
